name: Corregir fondo negro del icono de acceso
on:
  push:
    branches:
      - cresofin-cambiar-icono-app
    paths:
      - .github/workflows/fix-login-icon-background.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix-icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cresofin-cambiar-icono-app
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Eliminar el negro de todo el fondo, incluso con margen transparente
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          paths = [
              Path("cloudflare/publico/app/icon-nexora-flechas-192.png"),
              Path("cloudflare/publico/app/icon-nexora-flechas-512.png"),
          ]
          for path in paths:
              im = Image.open(path).convert("RGBA")
              px = im.load()
              w, h = im.size
              removed = 0
              softened = 0
              for y in range(h):
                  for x in range(w):
                      r, g, b, a = px[x, y]
                      if a == 0:
                          continue
                      darkness = max(r, g, b)
                      if darkness <= 80:
                          px[x, y] = (r, g, b, 0)
                          removed += 1
                      elif darkness <= 112:
                          new_a = round(a * (darkness - 80) / 32)
                          px[x, y] = (r, g, b, min(a, new_a))
                          softened += 1
              im.save(path, optimize=True)
              verify = Image.open(path).convert("RGBA")
              transparent = sum(1 for _, _, _, a in verify.getdata() if a == 0)
              print(f"{path}: {w}x{h}; negro eliminado={removed}; borde suavizado={softened}; transparentes finales={transparent}")
              if removed == 0:
                  raise SystemExit(f"{path}: no se eliminó ningún píxel oscuro; detener publicación.")
          PY
      - name: Invalidar caché de los iconos
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ["cloudflare/publico/app/index.html", "cloudflare/publico/app/sw.js"]:
              p = Path(name)
              s = p.read_text()
              s = s.replace("20261017-transparent-arrows", "20261017-transparent-arrows-v2")
              p.write_text(s)
          PY
      - name: Guardar PNG corregidos y activar despliegue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare/publico/app/icon-nexora-flechas-192.png cloudflare/publico/app/icon-nexora-flechas-512.png cloudflare/publico/app/index.html cloudflare/publico/app/sw.js
          git commit -m "Remove black background from login icon"
          git push origin cresofin-cambiar-icono-app
