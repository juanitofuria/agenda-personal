name: Desplegar en Cloudflare

# Cada vez que se sube un cambio al bot (código del Worker o lógica común) se prueba y se despliega solo.
# El despliegue se ejecuta también con cambios de este workflow.
on:
  push:
    branches: [main, claude/android-notifications-app-pxj3sn]
    paths:
      - "cloudflare/**"
      - "firebase/functions/src/**"
      - ".github/workflows/deploy-cloudflare.yml"
  workflow_dispatch: # también se puede lanzar a mano desde la pestaña Actions

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false # un despliegue en curso termina antes de empezar el siguiente

jobs:
  desplegar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            cloudflare/package-lock.json
            firebase/functions/package-lock.json
      - run: npm ci
      - name: Tests del Worker
        run: npm test
      - name: Tests de la lógica común (bot, secciones, planificador)
        working-directory: firebase/functions
        run: |
          npm ci
          npm test
      - name: Empaquetar el Worker desde el código
        run: npm run empaquetar
      - name: Comprobar credenciales de Cloudflare
        id: cred
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Faltan los secretos CLOUDFLARE_API_TOKEN y/o CLOUDFLARE_ACCOUNT_ID en GitHub (Settings > Secrets and variables > Actions). No se despliega."
            echo "hay=false" >> "$GITHUB_OUTPUT"
          else
            echo "hay=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Crear las tablas que falten en D1 (es idempotente)
        if: steps.cred.outputs.hay == 'true'
        run: npx wrangler d1 execute agenda-personal --remote --file=schema.sql
      - name: Desplegar
        if: steps.cred.outputs.hay == 'true'
        run: npx wrangler deploy
