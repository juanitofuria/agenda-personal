<style>
/* ===== Temas: estilo (informal/formal) × modo (claro/oscuro). El script pone data-estilo y data-modo en <html>. ===== */
:root{--fondo:#eef5fd;--fondo2:#dcebfa;--tarjeta:#fff;--tinta:#0f2347;--suave:#51658a;--linea:rgba(30,70,140,.12);--azul:#2f6fd6;--azul2:#46a0ff;--ok:#27a85a;--rojo:#ef4a5a;--sombra:0 10px 28px rgba(40,90,170,.14);
  --fuente:'Nunito',system-ui,sans-serif;--titulo:'Nunito',system-ui,sans-serif;--radio:22px;--mano:'Caveat',cursive}
html[data-modo=oscuro]{--fondo:#0d1b34;--fondo2:#0a1630;--tarjeta:#14274a;--tinta:#fff;--suave:#9fb7e0;--linea:rgba(150,185,255,.16);--azul:#3d9bff;--azul2:#46a0ff;--sombra:0 10px 28px rgba(0,0,0,.35)}

html[data-estilo=formal][data-modo=oscuro]{--fondo:#0a1832;--fondo2:#071127;--tarjeta:#0e2142;--tinta:#fff;--suave:#7f9bc8;--linea:rgba(127,155,200,.2);--azul:#2f8bff;--sombra:0 6px 20px rgba(0,0,0,.4)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:var(--fuente);color:var(--tinta);background-color:var(--fondo);background-image:linear-gradient(160deg,color-mix(in srgb,var(--fondo) 78%,transparent),color-mix(in srgb,var(--fondo2) 82%,transparent)),url("fondo-agenda.svg?v=20261008");background-repeat:repeat;background-size:auto,320px 320px;min-height:100vh;padding-bottom:calc(env(safe-area-inset-bottom) + 24px)}
button,input,select{font:inherit;color:inherit}
.app{max-width:560px;margin:0 auto;padding:14px 16px}
/* ===== Cabecera ===== */
.cab{padding:18px 16px 14px;border-radius:var(--radio);background:var(--tarjeta);box-shadow:var(--sombra);border:1px solid var(--linea);position:relative;overflow:hidden}
.cab .fila1{display:flex;align-items:center;gap:14px;padding-right:40px}

.engranaje svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.engranaje:active{background:var(--linea)}
.cab .logo{flex:none;width:58px;height:58px}
.cab h1{margin:0;font:800 23px/1.1 var(--titulo);letter-spacing:-.3px}

.avw{position:relative;flex:none}

.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

.av.g0{background:linear-gradient(145deg,#4aa3ff,#2f6fd6)}.av.g1{background:linear-gradient(145deg,#ff9a5a,#f0652c)}.av.g2{background:linear-gradient(145deg,#4fd08a,#1f9d5a)}.av.g3{background:linear-gradient(145deg,#b58cff,#7a4fe0)}
.av.g4{background:linear-gradient(145deg,#ff7a8a,#e23a52)}.av.g5{background:linear-gradient(145deg,#4cc9d8,#1f94b0)}.av.g6{background:linear-gradient(145deg,#ffd35c,#e8a317)}.av.g7{background:linear-gradient(145deg,#8a97b8,#4a5a80)}
.rej-av{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:10px 0}

.colores{display:flex;gap:10px;justify-content:center;margin:8px 0 4px}.colores button{width:28px;height:28px;border-radius:50%;border:3px solid transparent;padding:0;cursor:pointer}.colores button.on{border-color:var(--tinta)}
.dia{margin:14px 4px 0;text-align:center;font:800 11.5px var(--fuente);letter-spacing:1.6px;text-transform:uppercase;color:var(--suave)}
html[data-estilo=formal] .dia{text-align:left;margin-left:2px}

.frase{margin:6px 4px 2px;font:700 22px/1.2 var(--mano);color:var(--azul2);text-align:center;transform:rotate(-1.5deg)}
.frase::after{content:"";display:block;height:5px;width:46%;margin:8px auto 0;border-radius:3px;background:var(--azul2);opacity:.75;transform:rotate(1deg)}
html[data-estilo=formal] .frase{font:italic 700 15.5px/1.4 var(--titulo);color:var(--suave);transform:none;text-align:left;margin:6px 2px 2px}
html[data-estilo=formal] .frase::after{width:76px;height:4px;margin:10px 0 0;background:var(--azul);opacity:1;transform:none;border-radius:2px}
.saludo{margin:18px 4px 10px;font:800 20px var(--titulo)}
.saludo small{display:block;font:600 13px var(--fuente);color:var(--suave);margin-top:2px}
/* ===== Tarjetas del menú ===== */
.rejilla{margin-top:16px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tarjeta{position:relative;text-align:left;border:1px solid var(--linea);background:var(--tarjeta);border-radius:var(--radio);padding:14px;box-shadow:var(--sombra);cursor:pointer;display:flex;flex-direction:column;gap:10px;min-height:118px;transition:transform .12s}
.tarjeta:active{transform:scale(.97)}
.tarjeta.ancha{grid-column:1/-1;min-height:0;flex-direction:row;align-items:center}
.tarjeta b{font:800 15.5px/1.2 var(--titulo)}
.tarjeta span.d{font-size:12px;color:var(--suave);font-weight:600;margin-top:3px;display:block}
.ico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:none;color:#fff}
.ico svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.c1{background:linear-gradient(145deg,#4aa3ff,#2f6fd6)}.c2{background:linear-gradient(145deg,#ff9a5a,#f0652c)}.c3{background:linear-gradient(145deg,#4fd08a,#1f9d5a)}
.c4{background:linear-gradient(145deg,#b58cff,#7a4fe0)}.c5{background:linear-gradient(145deg,#ff7a8a,#e23a52)}.c6{background:linear-gradient(145deg,#4cc9d8,#1f94b0)}
html[data-estilo=formal] .ico{border-radius:10px;background:color-mix(in srgb,var(--azul) 10%,transparent);color:var(--tinta)}
html[data-estilo=formal] .tarjeta::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:0 3px 3px 0;background:var(--acento,var(--azul))}
html[data-estilo=formal] .c1{--acento:#2f6fd6}html[data-estilo=formal] .c2{--acento:#e88a2a}html[data-estilo=formal] .c3{--acento:#27a85a}html[data-estilo=formal] .c4{--acento:#7a4fe0}html[data-estilo=formal] .c5{--acento:#e23a52}html[data-estilo=formal] .c6{--acento:#1f94b0}
html[data-estilo=formal] .ico[class*=c]{background:color-mix(in srgb,var(--acento) 12%,transparent);color:var(--acento)}
/* ===== Pantallas interiores ===== */
.barra{display:flex;align-items:center;gap:10px;margin:4px 0 14px}
.barra h2{margin:0;font:800 19px var(--titulo);flex:1}
.atras{border:0;background:var(--tarjeta);border:1px solid var(--linea);width:38px;height:38px;border-radius:12px;display:grid;place-items:center;cursor:pointer;box-shadow:var(--sombra)}
.atras svg{width:20px;height:20px;fill:none;stroke:var(--tinta);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.lista{display:flex;flex-direction:column;gap:10px}
.fila{display:flex;align-items:center;gap:12px;background:var(--tarjeta);border:1px solid var(--linea);border-radius:var(--radio);padding:12px 14px;box-shadow:var(--sombra)}
.fila .t{flex:1;min-width:0}.fila .t b{display:block;font-weight:800;font-size:15px}.fila .t small{color:var(--suave);font-weight:600;font-size:12.5px}
.fila.hecho .t b{text-decoration:line-through;opacity:.55}
.emo{font-size:26px;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--azul) 10%,transparent);flex:none}
.btn{border:0;border-radius:14px;padding:11px 16px;font-weight:800;font-size:14px;cursor:pointer;background:linear-gradient(145deg,var(--azul2),var(--azul));color:#fff;box-shadow:0 6px 16px rgba(47,111,214,.3)}
html[data-estilo=formal] .btn{border-radius:10px;background:var(--azul);box-shadow:none}
.btn.sec{background:color-mix(in srgb,var(--azul) 12%,transparent);color:var(--azul);box-shadow:none}
.btn.peligro{background:color-mix(in srgb,var(--rojo) 12%,transparent);color:var(--rojo);box-shadow:none}
.btn.chico{padding:8px 12px;font-size:13px;border-radius:11px}
.btn.ancho{width:100%;margin-top:10px}
.acciones{display:flex;gap:8px;flex-wrap:wrap}
.vacio{text-align:center;color:var(--suave);font-weight:700;padding:30px 10px}
.interr{width:50px;height:30px;border-radius:15px;background:var(--linea);border:0;position:relative;cursor:pointer;flex:none;transition:.2s}
.interr::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.3);transition:.2s}
.interr.on{background:var(--ok)}.interr.on::after{left:23px}
input[type=text],input[type=tel],input[type=time],input[type=datetime-local],input[type=date],textarea,select{width:100%;border:1px solid var(--linea);background-color:var(--tarjeta);border-radius:14px;padding:13px;font-weight:800;font-size:15px;outline:none;color:var(--tinta);transition:border-color .15s,box-shadow .15s}select{appearance:none;-webkit-appearance:none;cursor:pointer;padding-right:44px;background-image:linear-gradient(45deg,transparent 50%,var(--azul) 50%),linear-gradient(135deg,var(--azul) 50%,transparent 50%),linear-gradient(to right,var(--linea),var(--linea));background-position:calc(100% - 19px) 50%,calc(100% - 13px) 50%,calc(100% - 34px) 50%;background-size:6px 6px,6px 6px,1px 58%;background-repeat:no-repeat}select option{background:var(--tarjeta);color:var(--tinta)}input:focus,select:focus,textarea:focus{border-color:var(--azul);box-shadow:0 0 0 3px color-mix(in srgb,var(--azul) 16%,transparent)}
textarea{resize:vertical;font-family:inherit}
input:focus,select:focus,textarea:focus{border-color:var(--azul)}
label{display:block;font-weight:800;font-size:12.5px;color:var(--suave);margin:12px 2px 5px;text-transform:uppercase;letter-spacing:.8px}
.seg{display:flex;gap:6px;background:var(--linea);padding:4px;border-radius:14px}
.seg button{flex:1;border:0;background:transparent;padding:10px 6px;border-radius:11px;font-weight:800;font-size:13.5px;cursor:pointer;color:var(--suave)}
.seg button.on{background:var(--tarjeta);color:var(--tinta);box-shadow:0 2px 8px rgba(0,0,0,.15)}
.nota{font-size:12.5px;color:var(--suave);font-weight:600;margin:8px 4px}.selector-opciones{gap:8px}.selector-opcion{appearance:none;font:inherit;color:var(--tinta);background:var(--tarjeta);border:1px solid var(--linea);border-radius:14px;padding:14px;box-shadow:var(--sombra)}.selector-opcion:active{border-color:var(--azul);background:color-mix(in srgb,var(--azul) 10%,var(--tarjeta))}
.hoja{position:fixed;inset:0;background:rgba(5,12,30,.55);display:flex;align-items:stretch;z-index:10}
.hoja>div{width:100%;max-width:720px;margin:0 auto;background-color:var(--fondo);background-image:linear-gradient(color-mix(in srgb,var(--fondo) 84%,transparent),color-mix(in srgb,var(--fondo) 84%,transparent)),url("fondo-agenda.svg?v=20261008");background-repeat:repeat;background-size:auto,320px 320px;border-radius:0;padding:18px 16px calc(env(safe-area-inset-bottom) + 20px);height:100%;max-height:none;overflow:auto}
.hoja h3{margin:0 0 4px;font:800 19px var(--titulo)}
.resumen-pantalla{max-width:900px!important;padding:14px 18px calc(env(safe-area-inset-bottom) + 24px)!important}
.resumen-secciones{display:flex;flex-direction:column;gap:18px;padding-bottom:10px}
.resumen-seccion{background:color-mix(in srgb,var(--tarjeta) 82%,transparent);border:1px solid var(--linea);border-radius:20px;padding:16px;box-shadow:var(--sombra)}
.resumen-seccion>.resumen-seccion-cab{display:flex;align-items:center;gap:10px;margin:0 0 12px;padding-bottom:10px;border-bottom:1px solid var(--linea)}
.resumen-seccion>.resumen-seccion-cab .emo{width:40px;height:40px;font-size:22px}
.resumen-seccion>.resumen-seccion-cab b{font:800 17px var(--titulo)}
.resumen-seccion>.resumen-seccion-cab small{display:block;color:var(--suave);font-size:11.5px;font-weight:700;margin-top:2px}
.resumen-seccion .tm{gap:12px}
.resumen-seccion .doc:last-child,.resumen-seccion .noticias:last-child{margin-bottom:0}
.resumen-seccion .pie-ver{margin-bottom:0}
.aviso{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%);background:var(--tinta);color:var(--fondo);padding:11px 18px;border-radius:14px;font-weight:800;font-size:14px;z-index:20;max-width:90%;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.fab{position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom) + 20px);width:58px;height:58px;border-radius:20px;border:0;color:#fff;background:linear-gradient(145deg,var(--azul2),var(--azul));box-shadow:0 10px 24px rgba(47,111,214,.45);display:grid;place-items:center;cursor:pointer}

.fab svg{width:28px;height:28px;stroke:#fff;fill:none;stroke-width:2.6;stroke-linecap:round}.fab-global{z-index:9;width:62px;height:62px;border-radius:21px;right:18px;bottom:calc(env(safe-area-inset-bottom) + 20px)}

.subtareas{display:flex;flex-direction:column;gap:8px;margin-top:10px}

.subtarea .caja{width:25px;height:25px;border-radius:8px}

.subtarea.hecha .texto{text-decoration:line-through;opacity:.55}
.tarea-progreso{display:block;margin-top:4px;color:var(--suave);font-size:11.5px;font-weight:700}

.doc{background:var(--tarjeta);border:1px solid var(--linea);border-radius:var(--radio);padding:16px;box-shadow:var(--sombra);margin-bottom:12px;white-space:pre-wrap;word-break:break-word;font-size:14.5px;line-height:1.5;font-weight:600}
.doc b,.doc strong{font-weight:800}.doc a{color:var(--azul);font-weight:800}.doc code,.doc pre{font-family:ui-monospace,monospace;font-size:13px;background:var(--linea);border-radius:6px;padding:1px 5px}

.anadir{display:flex;gap:8px}.anadir .btn{padding:0 18px;font-size:20px}

.so{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--linea);padding:4px;border-radius:14px;margin:6px 0 14px}

.so button span{font-size:20px}.so button.on{background:var(--tarjeta);color:var(--tinta);box-shadow:0 2px 8px rgba(0,0,0,.15)}

.paso{display:flex;gap:12px;align-items:flex-start;background:var(--tarjeta);border:1px solid var(--linea);border-radius:16px;padding:12px;margin-bottom:8px}

/* ===== Panel del tiempo ===== */
.tm{display:flex;flex-direction:column;gap:12px;--tm-azul:#2f8bff}
.tm-c{border-radius:var(--radio);background:var(--tm-bg,var(--tarjeta));border:1px solid var(--linea);box-shadow:var(--sombra);padding:14px 16px;position:relative;overflow:hidden}

.tm-g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tm-hero{position:relative;min-height:136px;border-radius:var(--radio);overflow:hidden;background:var(--tarjeta);border:1px solid var(--linea);box-shadow:var(--sombra);display:flex;align-items:center;padding:14px 16px}
.tm-foto{position:absolute;right:0;top:0;bottom:0;width:60%;background:linear-gradient(160deg,#9ec3ea,#4f86c6);background-size:cover;background-position:center;-webkit-mask-image:linear-gradient(to right,transparent 0,#000 42%);mask-image:linear-gradient(to right,transparent 0,#000 42%)}

.tm-foto.sin::after{content:"";position:absolute;inset:auto 0 0 0;height:58%;background:linear-gradient(135deg,transparent 49%,#6f9fd8 50%) 0 100%/90px 100% repeat-x,linear-gradient(225deg,transparent 49%,#4f7fc0 50%) 40px 100%/110px 80% repeat-x}
.tm-tit{position:relative;z-index:1;display:flex;align-items:center;gap:10px;min-width:0;max-width:68%}
.tm-ico{font-size:38px;line-height:1;filter:drop-shadow(0 4px 8px rgba(0,0,0,.25))}
.tm-tit h1{margin:0;font:800 25px/1.08 var(--titulo);letter-spacing:-.4px;overflow-wrap:break-word;word-break:normal}

.tm-tit p{margin:4px 0 0;font-weight:700;font-size:12.5px;color:var(--suave)}
.tm-atras{position:absolute;top:10px;left:10px;z-index:2;width:34px;height:34px;border-radius:11px;background:var(--tarjeta);border:1px solid var(--linea);display:grid;place-items:center;cursor:pointer;padding:0;box-shadow:var(--sombra)}

.tm-hero.con-atras{padding-top:50px}
.tm-act{position:absolute;right:10px;top:10px;z-index:2;display:flex;align-items:center;gap:6px;background:rgba(15,30,60,.55);color:#fff;border-radius:12px;padding:5px 9px;font-weight:800;font-size:11.5px;backdrop-filter:blur(6px)}
.tm-act button{border:0;background:rgba(255,255,255,.2);color:#fff;border-radius:8px;padding:2px 7px;font:800 12px var(--fuente);cursor:pointer}
.tm-ppal{display:flex;align-items:center;gap:16px}
.tm-ppal .e{font-size:64px;line-height:1;filter:drop-shadow(0 6px 10px rgba(0,0,0,.2))}
.tm-ppal .g{font:800 54px/1 var(--titulo);letter-spacing:-2px}
.tm-ppal small{display:block;font-weight:700;color:var(--suave);font-size:13px;margin-top:4px}
.tm-det{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tm-det div{text-align:left}.tm-det span{display:block;font-size:12px;font-weight:700;color:var(--suave)}.tm-det b{display:block;font:800 16px var(--titulo);margin:2px 0 6px;white-space:nowrap}.tm-det em{font-style:normal;font-size:20px}
.tm-bar{height:6px;border-radius:3px;background:var(--linea);overflow:hidden}.tm-bar i{display:block;height:100%;border-radius:3px;background:var(--tm-azul)}
.tm-grad{position:relative;height:10px;border-radius:5px;background:linear-gradient(90deg,#3d9bff,#2ec4b6,#ffd23f,#ff8a3d,#ef4444);margin:10px 0 14px}

.tm-viento{display:flex;align-items:center;justify-content:space-between;gap:10px}.tm-viento b{font:800 20px var(--titulo)}.tm-viento p{margin:3px 0 0;font-size:13px;font-weight:600;color:var(--suave)}

.tm-brujula span{position:absolute;bottom:14px}
.tm-luna{display:flex;align-items:center;gap:12px}.tm-luna .e{font-size:44px;line-height:1}.tm-luna b{display:block;font:800 15px var(--titulo)}.tm-luna small{font-weight:700;color:var(--suave);font-size:12.5px}
.tm-btns{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.tm-graf{width:100%;height:120px;display:block}
.tm-horas{display:flex;flex-direction:column}

.tm-cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.tm-cal .d{font-size:11.5px;font-weight:800;color:var(--suave);padding-bottom:4px}

.tm-cal .x.hoy{background:color-mix(in srgb,var(--tm-azul) 22%,transparent);box-shadow:inset 0 0 0 2px var(--tm-azul)}
/* colores por tarjeta: informal claro, tintes suaves; formal y oscuro, sobrios */

<script>
const TG = window.Telegram && Telegram.WebApp;
const DEMO = new URLSearchParams(location.search).has("demo");
const S = { datos: null, vista: "inicio", pila: [], tipo: "alarma" };
const SONIDOS = {
  signature: { nombre: "Signature", emoji: "✦" },
  crystal: { nombre: "Crystal", emoji: "💎" },
  pulse: { nombre: "Pulse", emoji: "💓" },
  halo: { nombre: "Halo", emoji: "◉" },
  orbit: { nombre: "Orbit", emoji: "🪐" },
  velvet: { nombre: "Velvet", emoji: "🎵" },
};
const sonidoValido = (s) => Object.prototype.hasOwnProperty.call(SONIDOS, s) ? s : "signature";
let audioSonido = null;
const $ = (s, r = document) => r.querySelector(s);
const esc = (t) => String(t ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ic = (n) => `<svg><use href="#i-${n}"/></svg>`;

/* ---------- Tema: estilo del usuario y modo (claro/oscuro/automático = el del propio Telegram, o sea, el de tu dispositivo) ---------- */
function actualizarIconos(modo) {
  const icono = modo === "oscuro" ? "icon-oscuro.webp" : "icon-claro.webp";
  const f = document.getElementById("favicon"); if (f) f.href = icono;
  const a = document.querySelector("link[rel='apple-touch-icon']"); if (a) a.href = icono;
}
function aplicarTema() {
  const u = S.datos?.usuario, root = document.documentElement;
  const sistema = (TG && TG.initData && TG.colorScheme) || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  const modo = !u || u.modo === "auto" ? (sistema === "dark" ? "oscuro" : "claro") : u.modo;
  root.dataset.estilo = u ? u.estilo : "informal"; root.dataset.modo = modo; actualizarIconos(modo);
  const logo = modo === "oscuro" ? "--logo-fondo:#f4f8ff;--logo-borde:#dfe9f8;--logo-tapa:#ef4a5a;--logo-check:#3d6fcf" : "--logo-fondo:#fff;--logo-borde:#2f6fd6;--logo-tapa:#ef4a5a;--logo-check:#27a85a";
  const formal = root.dataset.estilo === "formal" ? "--logo-fondo:transparent;--logo-borde:currentColor;--logo-tapa:transparent;--logo-check:currentColor" : logo;
  root.style.cssText = formal;
  if (TG) { const bg = getComputedStyle(root).getPropertyValue("--fondo").trim() || "#eef5fd"; try { TG.setHeaderColor(bg); TG.setBackgroundColor(bg); } catch (e) {} }
}
if (TG) TG.onEvent("themeChanged", aplicarTema);
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", aplicarTema);

/* ---------- API ---------- */
/* Identificación: dentro de Telegram, con sus datos firmados; fuera (navegador o app instalada), con la sesión que crea el enlace de acceso (/app en el bot). */
const enTelegram = () => !!(TG && TG.initData);
const leerSesion = () => { try { return localStorage.getItem("sesion") || ""; } catch (e) { return ""; } };
const guardarSesion = (t) => { try { t ? localStorage.setItem("sesion", t) : localStorage.removeItem("sesion"); } catch (e) {} };
async function api(ruta, cuerpo = {}, reintentar = true) {
  if (DEMO) return demo(ruta, cuerpo);
  if (!enTelegram() && !leerSesion() && ruta !== "/api/sesion") {
    const sr = await fetch("/api/sesion", { method: "POST", headers: { "content-type": "application/json" }, body: "{}" });
    const sj = await sr.json().catch(() => ({}));
    if (!sr.ok || !sj.token) throw new Error(sj.error || "No he podido iniciar tu agenda");
    guardarSesion(sj.token);
  }
  const cab = { "content-type": "application/json" };
  if (enTelegram()) cab.authorization = "tma " + TG.initData; else if (leerSesion()) cab.authorization = "sesion " + leerSesion();
  const r = await fetch(ruta, { method: "POST", headers: cab, body: JSON.stringify(cuerpo) });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401 && !enTelegram() && ruta !== "/api/sesion" && reintentar) {
    guardarSesion("");
    return api(ruta, cuerpo, false);
  }
  if (r.status === 401 && !enTelegram() && ruta !== "/api/sesion") { guardarSesion(""); const e = new Error(j.error || "Tu sesión ha caducado"); e.sesion = true; throw e; }
  if (!r.ok) throw new Error(j.error || "Algo ha fallado");
  return j;
}
async function cargar() { S.datos = await api("/api/estado"); try { const d=new Date(); d.setDate(1); d.setMonth(d.getMonth()-1); const mesAnterior=d.toISOString().slice(0,7); await api("/api/economia",{accion:"archivar_mes",mes:mesAnterior}); S.datos = await api("/api/estado"); } catch {} aplicarTema(); if (S.vista === "dispositivos" && typeof refrescarDispositivos === "function") await refrescarDispositivos(); }
function aviso(t) { const d = document.createElement("div"); d.className = "aviso"; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 2600); }
async function hacer(f, ok) { try { const r = await f(); if (ok) aviso(typeof ok === "function" ? ok(r) : ok); await cargar(); pintar(); return r; } catch (e) { aviso(e.message); return false; } }

/* ---------- Contenido de Telegram → HTML seguro (solo etiquetas simples y enlaces https) ---------- */
function limpiar(html) {
  const d = new DOMParser().parseFromString("<body>" + html + "</body>", "text/html");
  const ok = new Set(["B", "STRONG", "I", "EM", "U", "S", "CODE", "PRE", "BLOCKQUOTE", "A"]);
  const rec = (n) => {
    if (n.nodeType === 3) return esc(n.textContent);
    if (n.nodeType !== 1) return "";
    const dentro = [...n.childNodes].map(rec).join("");
    if (!ok.has(n.tagName)) return dentro;
    const t = n.tagName.toLowerCase();
    if (t === "a") { const h = n.getAttribute("href") || ""; return /^https?:\/\//i.test(h) ? `<a href="${esc(h)}" data-url="${esc(h)}">${dentro}</a>` : dentro; }
    return `<${t}>${dentro}</${t}>`;
  };
  return [...d.body.childNodes].map(rec).join("");
}
async function abrirVer(ref, titulo, guardado = false) {
  const t = titulo || (ref === "todo" ? "Resumen de hoy" : (S.datos.secciones.find((s) => s.ref === ref) || {}).titulo || "Sección");
  const reemplaza = S.vista === "ver";
  S.ver = { ref, titulo: t, secciones: null };
  if (reemplaza) pintar(); else ir("ver");
  try { const r = await api("/api/ver", { ref, guardado }); S.ver.secciones = r.secciones; }
  catch (e) { S.ver.secciones = [{ ref, error: e.message, botones: [] }]; }
  if (S.vista === "ver" && S.ver.ref === ref) pintar();
}

/* ---------- Navegación, con el historial del navegador: el gesto de «atrás» del móvil vuelve a la pantalla anterior (o cierra la ventana abierta) en vez de salir de la app ---------- */
const IR = { perfil: "ajustes", eventos: "inicio" }; // nombres antiguos que aún pueden llegar de los botones de las secciones o de enlaces
const TIPOS_EV = ["alarma", "cita", "tarea", "nota", "mensaje"];
async function ir(v, tipo) {
  v = IR[v] || v;
  S.pila.push({ v: S.vista, tipo: S.tipo }); S.vista = v; if (tipo) S.tipo = tipo;
  if (v === "dispositivos") await refrescarDispositivos();
  history.pushState({ n: S.pila.length }, "");
  pintar(); window.scrollTo(0, 0);
}
function irDirecto(v, tipo) { S.pila = [{ v: "inicio" }]; S.vista = v; if (tipo) S.tipo = tipo; history.pushState({ n: 1 }, ""); pintar(); }
function volver() {
  const p = S.pila.pop(); S.vista = p ? p.v : "inicio"; if (p && p.tipo) S.tipo = p.tipo;
  pintar(); window.scrollTo(0, 0);
  if (S.vista === "inicio") cargar().then(pintar).catch(() => {}); // al volver a la principal se ve lo último (resúmenes pedidos, contadores…)
}
function atras() { if (S.pila.length && history.state && history.state.n) history.back(); else volver(); }
window.addEventListener("popstate", () => {
  if (S.ignorarPop) { S.ignorarPop = false; return; }
  const hoja = document.querySelector(".hoja");
  if (hoja) { S.cierraPop = true; hoja.remove(); return; } // «atrás» con una ventana abierta: se cierra la ventana
  if (S.pila.length) volver();
});
// Cada ventana (hoja) abierta añade una entrada al historial, para que «atrás» la cierre; si se cierra con sus botones, se deshace esa entrada.
new MutationObserver((cambios) => {
  for (const c of cambios) {
    for (const n of c.addedNodes) if (n.classList && n.classList.contains("hoja")) history.pushState({ hoja: 1 }, "");
    for (const n of c.removedNodes) if (n.classList && n.classList.contains("hoja")) {
      if (S.cierraPop) S.cierraPop = false;
      else if (history.state && history.state.hoja) { S.ignorarPop = true; history.back(); }
    }
  }
}).observe(document.body, { childList: true });
function botonAtras() {
  if (!TG || !TG.BackButton) return;
  if (S.vista === "inicio") TG.BackButton.hide(); else TG.BackButton.show();
}

{

function panelHoras(t) {
  const hs = t.horas, mn = Math.min(...hs.map((h) => h.temp)), mx = Math.max(...hs.map((h) => h.temp)), rango = Math.max(1, mx - mn);
  const W = 340, H = 110, x = (i) => 8 + (i * (W - 16)) / Math.max(1, hs.length - 1), y = (v) => 12 + (1 - (v - mn) / rango) * (H - 36);
  const linea = hs.map((h, i) => `${i ? "L" : "M"}${x(i).toFixed(1)} ${y(h.temp).toFixed(1)}`).join(" ");
  const grafico = `<svg class="tm-graf" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-label="Evolución de la temperatura"><defs><linearGradient id="tg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff8a3d" stop-opacity=".45"/><stop offset="1" stop-color="#3d9bff" stop-opacity=".05"/></linearGradient></defs>
    <path d="${linea} L${x(hs.length - 1).toFixed(1)} ${H} L${x(0).toFixed(1)} ${H} Z" fill="url(#tg)"/><path d="${linea}" fill="none" stroke="#ff8a3d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    ${hs.map((h, i) => (i % 3 === 0 ? `<text x="${x(i)}" y="${y(h.temp) - 7}" text-anchor="middle" font-size="10" font-weight="800" fill="currentColor">${h.temp}°</text>` : "")).join("")}</svg>`;
  const tarjetas = hs.map((h) => `<div class="tm-hour-card ${h.prob >= 60 || h.mm >= 0.1 ? "llueve" : ""}">
      <span class="hora">${hh2(h.hora)}:00</span><span class="e">${h.emoji}</span><span class="temp">${h.temp}°</span>
      <div class="meta"><span>💧 ${h.prob}%${h.mm >= 0.1 ? " · " + n1(h.mm) + " l/m²" : ""}</span><span>💨 ${h.viento} km/h · ${h.humedad}%</span></div>
    </div>`).join("");
  return `<div class="tm">
    ${heroTiempo(t, t.ciudad, "Hora a hora · próximas " + hs.length + " horas", "🕐")}
    <div class="tm-c tm-temp-c"><div class="tm-hour-intro"><div><b>Temperatura por horas</b><small style="display:block">${hh2(hs[0]?.hora ?? 0)}:00 → ${hh2(hs[hs.length - 1]?.hora ?? 0)}:00</small></div><span>🌡</span></div>${grafico}</div>
    <div class="tm-c tm-lluvia-c"><div class="tm-hour-intro"><div><b>Previsión detallada</b><small style="display:block">Lluvia · viento · humedad</small></div><span>🌦️</span></div><div class="tm-hour-grid">${tarjetas}</div></div>
    <div class="tm-btns"><button class="tm-btn" data-ver="tiempo"><span>‹</span>Resumen del tiempo</button><button class="tm-btn" data-ver="tiempo:luna"><span>🌙</span>Calendario lunar<span>›</span></button></div></div>`;
}

async function ponerFoto() {
  const els = [...document.querySelectorAll(".tm-foto[data-foto]")]; if (!els.length) return;
  const ciudad = els[0].dataset.foto, clave = "foto_" + ciudad;
  const poner = (url) => { if (url) els.forEach((e) => { e.classList.remove("sin"); e.style.backgroundImage = `url("${url}")`; }); };
  let url = ""; try { url = localStorage.getItem(clave) || ""; } catch (e) {}
  if (url) return poner(url);
  try { url = (await api("/api/foto")).foto || ""; if (url) { try { localStorage.setItem(clave, url); } catch (e) {} poner(url); } } catch (e) { /* se queda la ilustración */ }
}

async function hojaResumenDiario() {
  const h=document.createElement("div"); h.className="hoja";
  h.innerHTML=`<div class="resumen-pantalla"><div class="barra"><button class="atras" data-cerrar-resumen aria-label="Cerrar"><svg><use href="#i-atras"/></svg></button><h2 style="margin:0;font:800 19px var(--titulo);flex:1">Resumen de hoy</h2><button class="atras" data-actualizar-resumen aria-label="Actualizar">↻</button></div><div id="resumen-diario-contenido"><div class="doc"><div class="esq"></div><div class="esq" style="width:85%"></div><div class="esq" style="width:70%"></div><div class="esq"></div></div></div></div>`;
  document.body.appendChild(h);
  const contenido=h.querySelector("#resumen-diario-contenido");
  const cargarResumen=async()=>{
    const btn=h.querySelector("[data-actualizar-resumen]");
    if(btn){btn.disabled=true;btn.textContent="…";}
    try{
      const r=await api("/api/ver",{ref:"todo"});
      const secciones=r.secciones||[];
      const botones=(x)=>x.botones&&x.botones.length?`<div class="botones">${x.botones.map((b)=>`<button class="btn chico sec" ${b.url?`data-url="${esc(b.url)}"`:b.ref?`data-ver="${esc(b.ref)}"`:`data-ir="${esc(IR[b.ir]||b.ir)}"`}>${esc(b.texto)}</button>`).join("")}</div>`:"";
      const pie=(x)=>x.hora?`<div class="pie-ver"><small>${x.guardado?"Pedido":"Actualizado"} hoy a las ${esc(x.hora)}</small></div>`:"";
      contenido.innerHTML=secciones.length?`<div class="resumen-secciones">${secciones.map((x)=>`
        <section class="resumen-seccion">
          <div class="resumen-seccion-cab"><div class="emo">${esc(x.emoji||"📋")}</div><div><b>${esc(String((x.titulo||x.ref||"Sección").replace(/^\s*(?:tema|sección)\s*:\s*/i,"").trim()).toUpperCase())}</b>${x.hora?`<small>${x.guardado?"Pedido":"Actualizado"} hoy a las ${esc(x.hora)}</small>`:""}</div></div>
          ${x.error
            ? `<div class="doc"><span class="err">No he podido preparar esta sección.</span><br>${esc(x.error)}</div>`
            : x.tiempo
              ? panelTiempoHTML({ ...x.tiempo, ref:x.ref })
              : x.grupos&&x.grupos.length
                ? `${noticiasHTML(x.grupos)}${botones(x)}`
                : `<div class="doc">${limpiar(x.html)}${botones(x)}</div>`}
        </section>`).join("")}</div>`
        :`<div class="vacio">Aún no hay secciones activadas para el resumen de hoy.</div>`;
    }catch(e){contenido.innerHTML=`<div class="doc"><span class="err">No he podido cargar el resumen.</span><br>${esc(e.message)}</div>`;}
    finally{if(btn){btn.disabled=false;btn.textContent="↻";}}
  };
  h.addEventListener("click",(e)=>{
    if(e.target.closest("[data-cerrar-resumen]")||e.target===h)return h.remove();
    if(e.target.closest("[data-actualizar-resumen]"))return cargarResumen();
    const el=e.target.closest("[data-ver]");
    if(el)return abrirVer(el.dataset.ver,undefined,el.dataset.g==="1");
  });
  await cargarResumen();

[sel.selectedIndex].text+' <span style="float:right">⌄</span>';modal.remove()})};$("#ec-picker-con",h).addEventListener("click",()=>abrirSelector("con",ingreso?"Tipo de ingreso":"Tipo de gasto"));$("#ec-picker-grupo",h)?.addEventListener("click",()=>abrirSelector("grupo","Grupo financiero"));const cerrar=()=>h.remove();h.addEventListener("click",async e=>{if(e.target===h||e.target.closest("[data-ec-no]"))return cerrar();if(!e.target.closest("[data-ec-ok]"))return;const valor=select.value;const titulo=valor==="Personalizado"?$("#ec-con-custom",h).value.trim():select.options[select.selectedIndex].text.trim();const fijo=["Vivienda","Luz","Agua","Alimentacion","Transporte","Seguros","Impuestos","Salud"];const grupo=ingreso?"":(valor==="Personalizado"?$("#ec-grupo",h).value:(fijo.includes(valor)?"fijo":"variable"));const textoImporte=$("#ec-imp",h).value.trim().replace(/\\s/g,"").replace(",",".");if(!titulo)return aviso("Escribe el nombre del ingreso/gasto");if(!ingreso&&!grupo)return aviso("Elige el grupo financiero para contabilizar el gasto");if(!textoImporte||!Number.isFinite(Number(textoImporte))||Number(textoImporte)<=0)return aviso("Introduce una cantidad válida");try{await api("/api/economia",{accion:"movimiento",tipo,concepto:titulo,importe:textoImporte,categoria:valor==="Personalizado"?"Personalizado":titulo,grupo:grupo,fecha:$("#ec-fecha",h).value});cerrar();await cargar();pintar();aviso("💾 Guardado")}catch(err){aviso(err.message)}})}
function hojaEconomiaFactura(){const h=document.createElement("div");h.className="hoja";const hoy=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);h.innerHTML=`<div><h3>🧾 Nueva factura</h3><label>Concepto</label><input id="ec-fcon" maxlength="100" placeholder="Luz, alquiler, seguro…"><label>Importe (€)</label><input id="ec-fimp" type="number" min="0.01" step="0.01"><label>Vencimiento</label><input id="ec-fven" type="date" value="${hoy}"><button class="btn ancho" data-ec-ok>Guardar factura</button><button class="btn sec ancho" data-ec-no>Cancelar</button></div>`;document.body.appendChild(h);h.addEventListener("click",async e=>{if(e.target===h||e.target.closest("[data-ec-no]"))return h.remove();if(e.target.closest("[data-ec-ok]")){try{await api("/api/economia",{accion:"factura",concepto:$("#ec-fcon",h).value,importe:$("#ec-fimp",h).value,vencimiento:$("#ec-fven",h).value});h.remove();await cargar();pintar();aviso("🧾 Factura guardada")}catch(err){aviso(err.message)}}})}

function hojaEconomiaPorcentajes(){const p=S.datos.economia?.porcentajes||{fijo:50,variable:30,ahorro:20},h=document.createElement("div");h.className="hoja";h.innerHTML=`<div><h3>⚙️ Distribución de ingresos</h3><p class="nota">Ajusta los porcentajes a tu realidad. La suma debe ser exactamente 100%.</p><label>Gastos fijos · necesidades básicas (%)</label><input id="ep-fijo" type="number" min="0" max="100" value="${p.fijo}"><label>Gastos variables · deseos y ocio (%)</label><input id="ep-variable" type="number" min="0" max="100" value="${p.variable}"><label>Ahorro · futuro (%)</label><input id="ep-ahorro" type="number" min="0" max="100" value="${p.ahorro}"><p id="ep-suma" class="nota">Total: 100%</p><button class="btn ancho" data-ep-guardar>Guardar porcentajes</button><button class="btn sec ancho" data-ep-cancelar>Cancelar</button></div>`;document.body.appendChild(h);const suma=()=>Number($("#ep-fijo",h).value)+Number($("#ep-variable",h).value)+Number($("#ep-ahorro",h).value);h.addEventListener("input",()=>$("#ep-suma",h).textContent="Total: "+suma()+"%");h.addEventListener("click",async e=>{if(e.target===h||e.target.closest("[data-ep-cancelar]"))return h.remove();if(e.target.closest("[data-ep-guardar]")){if(suma()!==100)return aviso("Los porcentajes deben sumar 100%");try{await api("/api/economia",{accion:"porcentajes",fijo:Number($("#ep-fijo",h).value),variable:Number($("#ep-variable",h).value),ahorro:Number($("#ep-ahorro",h).value)});h.remove();await cargar();pintar();aviso("Porcentajes guardados")}catch(x){aviso(x.message)}}})}
function hojaEconomiaPresupuesto(){const h=document.createElement("div");h.className="hoja";h.innerHTML=`<div><h3>📐 Presupuesto mensual</h3><p class="nota">Fija el máximo que quieres gastar. Si no lo defines, usamos como referencia el 80% de tus ingresos registrados.</p><label>Presupuesto (€)</label><input id="ec-pimp" type="number" min="0" step="0.01" value="${S.datos.economia?.presupuestoMensual??""}" placeholder="1800"><button class="btn ancho" data-ec-ok>Guardar</button><button class="btn sec ancho" data-ec-no>Cancelar</button></div>`;document.body.appendChild(h);h.addEventListener("click",async e=>{if(e.target===h||e.target.closest("[data-ec-no]"))return h.remove();if(e.target.closest("[data-ec-ok]")){try{await api("/api/economia",{accion:"presupuesto",importe:$("#ec-pimp",h).value});h.remove();await cargar();pintar();aviso("📐 Presupuesto guardado")}catch(err){aviso(err.message)}}})}
function hojaAnadir() {
  const h = document.createElement("div"); h.className = "hoja";
  const opcion = (tipo, emoji, titulo, desc) => `<button class="fila pulsable" data-anadir-tipo="${tipo}" style="text-align:left"><div class="emo">${emoji}</div><div class="t"><b>${titulo}</b><small>${desc}</small></div><svg class="ch"><use href="#i-mas-der"/></svg></button>`;
  h.innerHTML = `<div><h3>＋ Añadir</h3><p class="nota">Elige qué quieres crear. Se abrirá directamente el formulario correspondiente.</p>
    <div class="lista">
      ${opcion("tarea","✅","Tarea pendiente","Una tarea con subtareas si las necesitas")}
      ${opcion("cita","📅","Cita","Fecha, hora, lugar y aviso")}
      ${opcion("alarma","⏰","Alarma","Un recordatorio a una hora concreta")}
      ${opcion("nota","📝","Nota","Un apunte o texto para recordar")}
      ${opcion("economia","💶","Economía","Controla ingresos, gastos y objetivos")}
      ${opcion("mensaje","💬","Mensaje de WhatsApp","Programa un mensaje para enviarlo más tarde")}
      ${opcion("compra","🛒","Lista de la compra","Añadir uno o varios artículos")}
    </div>
    <button class="btn sec ancho" data-cerrar-anadir="1">Cancelar</button></div>`;
  document.body.appendChild(h);
  h.addEventListener("click", (e) => {
    if (e.target === h || e.target.closest("[data-cerrar-anadir]")) return h.remove();
    const o = e.target.closest("[data-anadir-tipo]");
    if (!o) return;
    const tipo = o.dataset.anadirTipo;
    h.remove();
    if (tipo === "economia") { irDirecto("economia"); return; }
    if (tipo === "compra") { irDirecto("compra"); setTimeout(() => $("#nuevo-art")?.focus(), 50); return; }
    hojaNuevo(tipo);
  });
}
function hojaTarea(e) {
  if (!e || e.tipo !== "tarea") return;
  const h = document.createElement("div"); h.className = "hoja";
  let subs = [...(e.subtareas || [])];
  const pintar = () => {
    const hechas = subs.filter((x) => x.hecho).length;
    h.querySelector("#tarea-detalle").innerHTML = `<div class="doc"><b>Progreso</b><small class="tarea-progreso">${hechas}/${subs.length} subtareas completadas</small></div>
      <div class="subtareas">${subs.map((x) => `<div class="subtarea ${x.hecho ? "hecha" : ""}"><button class="caja ${x.hecho ? "on" : ""}" data-sub-hecha="${x.id}">${x.hecho ? "✓" : ""}</button><span class="texto">${esc(x.titulo)}</span><button class="btn chico peligro" data-sub-borrar="${x.id}">✕</button></div>`).join("") || '<div class="vacio">Todavía no hay subtareas.</div>'}</div>
      <div class="anadir" style="margin-top:12px"><input type="text" id="nueva-subtarea" maxlength="120" placeholder="Añadir subtarea"><button class="btn" data-sub-anadir="1">＋</button></div>`;
  };
  h.innerHTML = `<div><h3>✅ ${esc(e.titulo)}</h3><p class="nota">Añade los pasos o partes de esta tarea. Por ejemplo: <b>Trabajo de matemáticas</b> → problemas, ejercicios, entregar.</p><div id="tarea-detalle"></div><button class="btn sec ancho" data-cerrar-tarea="1">Cerrar</button></div>`;
  document.body.appendChild(h); pintar();
  h.addEventListener("click", async (ev) => {
    if (ev.target === h || ev.target.closest("[data-cerrar-tarea]")) return h.remove();
    const id = ev.target.closest("[data-sub-hecha]")?.dataset.subHecha;
    if (id) {
      const r = await hacer(() => api("/api/evento/accion", { id:e.id, accion:"subtarea_hecha", subtareaId:id }));
      if (r !== false) { const x=subs.find(s=>s.id===id); if(x) x.hecho=!x.hecho; pintar(); }
      return;
    }
    const borrar = ev.target.closest("[data-sub-borrar]")?.dataset.subBorrar;
    if (borrar) {
      if (!confirm("¿Eliminar esta subtarea?")) return;
      const r = await hacer(() => api("/api/evento/accion", { id:e.id, accion:"subtarea_borrar", subtareaId:borrar }), "🗑 Subtarea eliminada");
      if (r !== false) { subs=subs.filter(s=>s.id!==borrar); pintar(); }
      return;
    }
    if (ev.target.closest("[data-sub-anadir]")) {
      const input=$("#nueva-subtarea",h), titulo=input?.value.trim(); if(!titulo) return;
      const r = await hacer(() => api("/api/evento/accion", { id:e.id, accion:"subtarea_anadir", titulo }), "✅ Subtarea añadida");
      if (r !== false) { subs.push(r.subtarea); input.value=""; pintar(); setTimeout(()=>input.focus(),20); }
    }
  });
}

/* ---------- Formulario de evento ---------- */
function hojaNuevo(tipoIni = "alarma") {
  const d = new Date(Date.now() + 3600e3); d.setMinutes(0, 0, 0);
  const loc = new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
  const h = document.createElement("div"); h.className = "hoja";
  h.innerHTML = `<div><h3>Nuevo</h3>
    <div class="seg" id="tipo" style="margin-top:10px;font-size:12px"><button data-t="alarma">⏰ Alarma</button><button data-t="cita">📅 Cita</button><button data-t="tarea">✅ Tarea</button><button data-t="nota">📝 Nota</button><button data-t="mensaje">💬 WhatsApp</button></div>
    <div id="f-nombre"><label>Nombre</label><input type="text" id="f-titulo" maxlength="80" placeholder="¿Cómo lo llamamos?"></div>
    <div id="f-fecha"><label>Cuándo</label><input type="datetime-local" id="f-cuando" value="${loc}"></div>
    <div id="f-extra"></div>
    <button class="btn ancho" id="f-ok">Guardar</button><button class="btn sec ancho" id="f-no">Cancelar</button></div>`;
  document.body.appendChild(h);
  let tipo = tipoIni;
  const soportaContactos = "contacts" in navigator && "ContactsManager" in window;
  const wa = { modo: soportaContactos ? "contactos" : "manual", para: "", tel: "", texto: "", rep: "ninguna", opcionesTel: [] };
  const bloqueWa = () => `<label>Para quién</label>
    <div class="seg" id="wa-modo"><button class="${wa.modo === "contactos" ? "on" : ""}" data-wm="contactos">📇 Contactos</button><button class="${wa.modo === "manual" ? "on" : ""}" data-wm="manual">✍️ A mano</button><button class="${wa.modo === "elegir" ? "on" : ""}" data-wm="elegir">📲 Al enviar</button></div>
    ${wa.modo === "contactos" ? (soportaContactos
        ? `<button class="btn sec ancho" data-wa-elegir="1" style="margin-top:8px">📇 ${wa.para ? "Cambiar de contacto" : "Elegir de mis contactos"}</button>
           ${wa.opcionesTel.length > 1 ? `<p class="nota">${esc(wa.para)} tiene varios números, elige uno:</p>${wa.opcionesTel.map((t, i) => `<button class="btn sec ancho" style="margin-top:6px" data-wa-tel="${i}">${esc(t)}</button>`).join("")}` : ""}
           ${wa.para && wa.tel ? `<div class="aviso-ok" style="margin-top:8px">✅ ${esc(wa.para)} · ${esc(wa.tel)}</div>` : ""}`
        : `<p class="nota">Tu navegador no permite elegir contactos desde la app (solo Chrome en Android). Escríbelo «a mano» o elige «Al enviar».</p>`)
      : wa.modo === "manual" ? `<input type="text" id="f-para" maxlength="40" placeholder="Nombre (por ejemplo: Mamá)" value="${esc(wa.para)}" style="margin-top:8px"><input type="tel" id="f-tel" maxlength="20" placeholder="Teléfono: +34 600 000 000" autocomplete="off" value="${esc(wa.tel)}" style="margin-top:8px">`
      : `<input type="text" id="f-para" maxlength="40" placeholder="Nombre, para reconocerlo (opcional)" value="${esc(wa.para)}" style="margin-top:8px"><p class="nota">Cuando llegue el aviso, WhatsApp te dejará elegir a quién enviarlo: no hace falta número.</p>`}
    <label>Mensaje</label><textarea id="f-texto" maxlength="1000" rows="4" placeholder="Lo que quieres enviar">${esc(wa.texto)}</textarea>
    <label>Repetir</label><select id="f-rep">${[["ninguna", "Solo una vez"], ["anual", "Cada año (cumpleaños…)"], ["semanal", "Cada semana"], ["diaria", "Cada día"]].map(([v, t]) => `<option value="${v}" ${wa.rep === v ? "selected" : ""}>${t}</option>`).join("")}</select>
    <p class="nota">A la hora indicada te avisaré con un botón: lo pulsas, se abre WhatsApp con el mensaje ya escrito y solo tienes que enviarlo.</p>`;
  const volcar = () => { wa.para = $("#f-para", h)?.value ?? wa.para; wa.tel = $("#f-tel", h)?.value ?? wa.tel; wa.texto = $("#f-texto", h)?.value ?? wa.texto; wa.rep = $("#f-rep", h)?.value ?? wa.rep; };
  const extra = () => {
    $("#f-extra", h).innerHTML = (tipo === "cita" ? `<label>Lugar</label><input type="text" id="f-lugar" maxlength="80" placeholder="Opcional"><label>Avisarme</label><select id="f-ant"><option value="30">30 min antes</option><option value="60" selected>1 hora antes</option><option value="180">3 horas antes</option><option value="1440">1 día antes</option><option value="0">A la hora</option></select>` : "")
      + (tipo === "alarma" ? `<label>Repetir</label><select id="f-rep"><option value="ninguna">Solo una vez</option><option value="diaria">Cada día</option><option value="laborables">Lunes a viernes</option><option value="semanal">Cada semana</option><option value="anual">Cada año</option></select>` : "")
      + (tipo === "mensaje" ? bloqueWa() : "")
      + (tipo === "tarea" ? `<p class="nota">Las tareas pueden no tener fecha: deja el campo vacío.</p>` : "")
      + (tipo === "nota" ? `<label>Nota</label><textarea id="f-ntexto" maxlength="4000" rows="6" placeholder="Escribe lo que quieres recordar"></textarea>` : "");
  };
  const aplicarTipo = () => {
    h.querySelectorAll("#tipo button").forEach((b) => b.classList.toggle("on", b.dataset.t === tipo));
    $("#f-nombre", h).style.display = tipo === "mensaje" ? "none" : ""; $("#f-fecha", h).style.display = tipo === "nota" ? "none" : "";
    $("#f-titulo", h).placeholder = tipo === "nota" ? "Título (opcional)" : "¿Cómo lo llamamos?";
    extra();
  };
  aplicarTipo();
  h.addEventListener("click", async (e) => {
    if (tipo === "mensaje") volcar(); // no perder lo escrito al cambiar de modo
    const t = e.target.closest("[data-t]"); if (t) { tipo = t.dataset.t; aplicarTipo(); }
    const wm = e.target.closest("[data-wm]");
    if (wm) { wa.modo = wm.dataset.wm; if (wa.modo === "elegir") wa.tel = ""; wa.opcionesTel = []; extra(); }
    if (e.target.closest("[data-wa-elegir]")) {
      try {
        const [c] = await navigator.contacts.select(["name", "tel"], { multiple: false });
        if (c) { wa.para = (c.name && c.name[0]) || ""; wa.opcionesTel = [...new Set((c.tel || []).map((t) => t.trim()))]; wa.tel = wa.opcionesTel.length === 1 ? wa.opcionesTel[0] : ""; if (!wa.opcionesTel.length) aviso("Ese contacto no tiene teléfono"); extra(); }
      } catch (err) { /* cancelado o sin permiso */ }
    }
    const wt = e.target.closest("[data-wa-tel]"); if (wt) { wa.tel = wa.opcionesTel[+wt.dataset.waTel]; wa.opcionesTel = []; extra(); }
    if (e.target.id === "f-no" || e.target === h) h.remove();
    if (e.target.id === "f-ok") {
      const cuerpo = tipo === "mensaje" ? { tipo, cuando: $("#f-cuando", h).value || null, para: wa.para, telefono: wa.modo === "elegir" ? "" : wa.tel, texto: wa.texto, repeticion: wa.rep } : { tipo, titulo: $("#f-titulo", h).value, cuando: tipo === "nota" ? null : $("#f-cuando", h).value || null, lugar: $("#f-lugar", h)?.value, para: $("#f-para", h)?.value, telefono: $("#f-tel", h)?.value, texto: tipo === "nota" ? $("#f-ntexto", h)?.value : $("#f-texto", h)?.value, antelacionMin: $("#f-ant", h)?.value, repeticion: $("#f-rep", h)?.value };
      await hacer(() => api("/api/evento", cuerpo), "✅ Guardado"); if (!document.querySelector(".aviso")?.textContent.startsWith("✅")) return; h.remove();
    }
  });
}

/* Nota: se lee completa y se puede borrar. */
function hojaNota(e) {
  if (!e) return;
  const h = document.createElement("div"); h.className = "hoja";

/* ---------- Cambiar avatar ---------- */
function redimensionar(archivo) {
  return new Promise((ok, mal) => {
    const url = URL.createObjectURL(archivo), img = new Image();
    img.onload = () => {
      const t = 192, c = document.createElement("canvas"); c.width = c.height = t;
      const lado = Math.min(img.width, img.height), sx = (img.width - lado) / 2, sy = (img.height - lado) / 2;
      c.getContext("2d").drawImage(img, sx, sy, lado, lado, 0, 0, t, t);
      URL.revokeObjectURL(url); ok(c.toDataURL("image/jpeg", 0.82));
    };
    img.onerror = () => { URL.revokeObjectURL(url); mal(new Error("No he podido leer esa imagen")); };
    img.src = url;
  });
}

  const reg = (await registrarSW()) && (await navigator.serviceWorker.ready);
  if (!reg) throw new Error("No he podido preparar las notificaciones en este navegador");
  const { clave } = await api("/api/push/clave");

}

      : { ...base, vista: "resumen", resumen: { emoji: "🌧", desc: "Chubascos", temp: 21, tMin: 19, tMax: 27, humedad: 47, viento: 14, dir: "SO", dirGrados: 225, vientoMax: 14, rachaMax: 35, uv: 4.1, uvNivel: "moderado", amanece: "08:17", anochece: "19:53", luz: "11 h 36 min de luz", horasDesde: 18, horasHasta: 11, maxima: { v: 27, hora: 18 }, minima: { v: 18, hora: 5 }, lluvia: { horas: 18, tramos: [{ desde: 18, hasta: 19, mm: 0.1, prob: 25 }, { desde: 20, hasta: 10, mm: 3.5, prob: 60 }] }, luna: { emoji: "🌘", nombre: "Luna menguante", iluminada: 21 }, caida: { ayer: 0.1, anio: 2026, total: 476.3 } } };
    return Promise.resolve({ secciones: [{ ref: c.ref, html: "", botones: [], hora: "18:45", tiempo }] });
  }
  if (ruta === "/api/ver") return new Promise((ok) => setTimeout(() => ok({ secciones: (c.ref === "todo" ? ["tiempo", "noticias"] : [c.ref]).map((ref) => ({ ref, html: ref === "tiempo" ? "🌤 <b>Tiempo · Córdoba</b>\nHoy: 24° / 11°, sol y algunas nubes.\n\n🕐 Mañana: <b>soleado</b>\n<i>Fuente: Open-Meteo</i>" : "📰 <b>Noticias del día</b>\n• Titular de ejemplo <a href=\"https://example.com\">enlace</a>\n• Otro titular de ejemplo", botones: ref === "tiempo" ? [{ texto: "🕐 Hora a hora", ref: "tiempo:horas" }, { texto: "🌙 Calendario lunar", ref: "tiempo:luna" }] : [], hora: "08:20", ...(ref === "noticias" ? { grupos: [{ titulo: "💶 Economía", noticias: [{ titulo: "La economía española crece más de lo previsto en el tercer trimestre", fuente: "Diario Ejemplo", fecha: Date.now() - 3 * 3600e3, imagen: "https://picsum.photos/seed/a/600/340", enlace: "https://example.com/1" }, { titulo: "El Gobierno aprueba un nuevo paquete de medidas", fuente: "Otro Medio", fecha: Date.now() - 5 * 3600e3, imagen: "https://picsum.photos/seed/b/300/200", enlace: "https://example.com/2" }, { titulo: "Sin foto: noticia solo con titular", fuente: "Prensa", fecha: Date.now() - 9 * 3600e3, enlace: "https://example.com/3" }] }] } : {}) })) }), 600));
  if (ruta === "/api/ciudad") return Promise.resolve({ lugares: [{ i: 0, etiqueta: "Córdoba, Andalucía, España" }] });
  return Promise.resolve(ruta === "/api/estado" ? structuredClone(d) : { ok: true });
}

/* ---------- Actualización automática: lo que se cambie desde otro dispositivo aparece solo ---------- */
const huella = (d) => { const c = { ...d }; delete c.ahora; return JSON.stringify(c); };
async function refrescar() {
  if (document.hidden || !S.datos || DEMO || S.ocupado) return;
  if (S.vista === "ver" || document.querySelector(".hoja")) return; // contenido ya preparado o ventana abierta: no se toca
  if ([...document.querySelectorAll("input,textarea,select")].some((e) => e.type !== "file" && e.value !== e.defaultValue)) return; // no pisar lo que se está escribiendo
  S.ocupado = true;
  try {
    const d = await api("/api/estado");
    if (!document.hidden && huella(d) !== huella(S.datos)) { S.datos = d; aplicarTema(); if (S.vista === "dispositivos") await refrescarDispositivos(); pintar(); }
  } catch (e) { /* sin conexión o sesión caducada: se reintenta en el siguiente ciclo */ }
  S.ocupado = false;
}
setInterval(refrescar, 15000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) refrescar(); });
window.addEventListener("focus", refrescar);

/* ---------- Arranque ---------- */
const MENSAJE_ENTRADA = `<div class="cargando" style="line-height:1.6">Para usar la app fuera de Telegram necesitas un <b>enlace de acceso</b>.<br><br>Escribe <b>/app</b> al bot en Telegram y abre el enlace que te dé en este dispositivo.</div>`;
(async () => {
  if (TG) { TG.ready(); TG.expand(); }
  const url = new URL(location.href);
  try {
    if (!DEMO && !enTelegram()) {
      const codigo = url.searchParams.get("acceso");
      if (codigo) { // enlace de acceso de un solo uso: se cambia por una sesión de este dispositivo
        $("#app").innerHTML = `<div class="cargando">Vinculando este dispositivo…</div>`;
        const r = await api("/api/sesion", { codigo });
        guardarSesion(r.token); url.searchParams.delete("acceso"); history.replaceState(null, "", url.pathname + (url.search || ""));
      }
      if (!leerSesion()) { $("#app").innerHTML = MENSAJE_ENTRADA; registrarSW(); return; }
    }
    await cargar(); registrarSW(); if (!enTelegram() && !DEMO) await refrescarDispositivos();
    const ver = url.searchParams.get("ver"), ir_ = url.searchParams.get("ir"), wa = url.searchParams.get("wa");
    if (ver || ir_ || wa) history.replaceState(null, "", url.pathname);
    history.replaceState({ n: 0 }, "");
    const destino = IR[ir_] || ir_;
    if (TIPOS_EV.includes(destino)) { irDirecto("tipo", destino); } else if (destino && destino !== "inicio" && vistas[destino]) { irDirecto(destino); } else pintar();
    if (ver) abrirVer(ver);
    if (wa) { const e = S.datos.eventos.find((x) => x.id === wa); if (e) { irDirecto("tipo", "mensaje"); hojaWa(e); } }
  } catch (e) { $("#app").innerHTML = e.sesion ? MENSAJE_ENTRADA : `<div class="cargando" style="line-height:1.6">${esc(e.message)}<br><br>Escribe <b>/app</b> al bot en Telegram para pedir un enlace nuevo.</div>`; }
})();
</script>
