<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">

<style>
/* ===== Temas: estilo (informal/formal) × modo (claro/oscuro). El script pone data-estilo y data-modo en <html>. ===== */
:root{--fondo:#eef5fd;--fondo2:#dcebfa;--tarjeta:#fff;--tinta:#0f2347;--suave:#51658a;--linea:rgba(30,70,140,.12);--azul:#2f6fd6;--azul2:#46a0ff;--ok:#27a85a;--rojo:#ef4a5a;--sombra:0 10px 28px rgba(40,90,170,.14);
  --fuente:'Nunito',system-ui,sans-serif;--titulo:'Nunito',system-ui,sans-serif;--radio:22px;--mano:'Caveat',cursive}
html[data-modo=oscuro]{--fondo:#0d1b34;--fondo2:#0a1630;--tarjeta:#14274a;--tinta:#fff;--suave:#9fb7e0;--linea:rgba(150,185,255,.16);--azul:#3d9bff;--azul2:#46a0ff;--sombra:0 10px 28px rgba(0,0,0,.35)}
html[data-estilo=formal]{--fondo:#f4f7fb;--fondo2:#fff;--tarjeta:#fff;--tinta:#0b1f4a;--suave:#5d6b86;--azul:#2f6fd6;--radio:14px;--titulo:'Playfair Display',Georgia,serif;--sombra:0 6px 20px rgba(11,31,74,.08)}
html[data-estilo=formal][data-modo=oscuro]{--fondo:#0a1832;--fondo2:#071127;--tarjeta:#0e2142;--tinta:#fff;--suave:#7f9bc8;--linea:rgba(127,155,200,.2);--azul:#2f8bff;--sombra:0 6px 20px rgba(0,0,0,.4)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:var(--fuente);color:var(--tinta);background:linear-gradient(160deg,var(--fondo),var(--fondo2));min-height:100vh;padding-bottom:calc(env(safe-area-inset-bottom) + 24px)}
button,input,select{font:inherit;color:inherit}
.app{max-width:560px;margin:0 auto;padding:14px 16px}
/* ===== Cabecera ===== */
.cab{padding:18px 16px 14px;border-radius:var(--radio);background:var(--tarjeta);box-shadow:var(--sombra);border:1px solid var(--linea);position:relative;overflow:hidden}
.cab .fila1{display:flex;align-items:center;gap:14px}
.cab .logo{flex:none;width:58px;height:58px}
.cab h1{margin:0;font:800 23px/1.1 var(--titulo);letter-spacing:-.3px}
html[data-estilo=formal] .cab h1{font-weight:700;font-size:23px}
.cab p{margin:4px 0 0;font-weight:700;font-size:13px;color:var(--suave)}
html[data-estilo=formal] .cab p{text-transform:uppercase;letter-spacing:2.4px;font-size:10.5px}
.avw{position:relative;flex:none}
.av{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font:800 26px var(--titulo);color:#fff;position:relative;overflow:hidden;border:0;padding:0;cursor:pointer;box-shadow:0 6px 16px rgba(20,60,140,.28)}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.avw .lapiz{position:absolute;right:-3px;bottom:-3px;width:22px;height:22px;border-radius:50%;background:var(--tarjeta);border:1px solid var(--linea);display:grid;place-items:center;font-size:11px;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.av.g0{background:linear-gradient(145deg,#4aa3ff,#2f6fd6)}.av.g1{background:linear-gradient(145deg,#ff9a5a,#f0652c)}.av.g2{background:linear-gradient(145deg,#4fd08a,#1f9d5a)}.av.g3{background:linear-gradient(145deg,#b58cff,#7a4fe0)}
.av.g4{background:linear-gradient(145deg,#ff7a8a,#e23a52)}.av.g5{background:linear-gradient(145deg,#4cc9d8,#1f94b0)}.av.g6{background:linear-gradient(145deg,#ffd35c,#e8a317)}.av.g7{background:linear-gradient(145deg,#8a97b8,#4a5a80)}
.rej-av{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:10px 0}
.rej-av button{aspect-ratio:1;border:2px solid transparent;border-radius:50%;font-size:24px;display:grid;place-items:center;padding:0;cursor:pointer;color:#fff}
.colores{display:flex;gap:10px;justify-content:center;margin:8px 0 4px}.colores button{width:28px;height:28px;border-radius:50%;border:3px solid transparent;padding:0;cursor:pointer}.colores button.on{border-color:var(--tinta)}
.dia{margin:14px 4px 0;text-align:center;font:800 11.5px var(--fuente);letter-spacing:1.6px;text-transform:uppercase;color:var(--suave)}
html[data-estilo=formal] .dia{text-align:left;margin-left:2px}

.frase{margin:6px 4px 2px;font:700 22px/1.2 var(--mano);color:var(--azul2);text-align:center;transform:rotate(-1.5deg)}
.frase::after{content:"";display:block;height:5px;width:46%;margin:8px auto 0;border-radius:3px;background:var(--azul2);opacity:.75;transform:rotate(1deg)}
html[data-estilo=formal] .frase{font:italic 700 15.5px/1.4 var(--titulo);color:var(--suave);transform:none;text-align:left;margin:6px 2px 2px}
html[data-estilo=formal] .frase::after{width:76px;height:4px;margin:10px 0 0;background:var(--azul);opacity:1;transform:none;border-radius:2px}
.saludo{margin:18px 4px 10px;font:800 20px var(--titulo)}
.saludo small{display:block;font:600 13px var(--fuente);color:var(--suave);margin-top:2px}
/* ===== Tarjetas del menú ===== */
.rejilla{margin-top:16px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tarjeta{position:relative;text-align:left;border:1px solid var(--linea);background:var(--tarjeta);border-radius:var(--radio);padding:14px;box-shadow:var(--sombra);cursor:pointer;display:flex;flex-direction:column;gap:10px;min-height:118px;transition:transform .12s}
.tarjeta:active{transform:scale(.97)}
.tarjeta.ancha{grid-column:1/-1;min-height:0;flex-direction:row;align-items:center}
.tarjeta b{font:800 15.5px/1.2 var(--titulo)}
.tarjeta span.d{font-size:12px;color:var(--suave);font-weight:600;margin-top:3px;display:block}
.ico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:none;color:#fff}
.ico svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.c1{background:linear-gradient(145deg,#4aa3ff,#2f6fd6)}.c2{background:linear-gradient(145deg,#ff9a5a,#f0652c)}.c3{background:linear-gradient(145deg,#4fd08a,#1f9d5a)}
.c4{background:linear-gradient(145deg,#b58cff,#7a4fe0)}.c5{background:linear-gradient(145deg,#ff7a8a,#e23a52)}.c6{background:linear-gradient(145deg,#4cc9d8,#1f94b0)}
html[data-estilo=formal] .ico{border-radius:10px;background:color-mix(in srgb,var(--azul) 10%,transparent);color:var(--tinta)}
html[data-estilo=formal] .tarjeta::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:0 3px 3px 0;background:var(--acento,var(--azul))}
html[data-estilo=formal] .c1{--acento:#2f6fd6}html[data-estilo=formal] .c2{--acento:#e88a2a}html[data-estilo=formal] .c3{--acento:#27a85a}html[data-estilo=formal] .c4{--acento:#7a4fe0}html[data-estilo=formal] .c5{--acento:#e23a52}html[data-estilo=formal] .c6{--acento:#1f94b0}
html[data-estilo=formal] .ico[class*=c]{background:color-mix(in srgb,var(--acento) 12%,transparent);color:var(--acento)}
/* ===== Pantallas interiores ===== */
.barra{display:flex;align-items:center;gap:10px;margin:4px 0 14px}
.barra h2{margin:0;font:800 19px var(--titulo);flex:1}
.atras{border:0;background:var(--tarjeta);border:1px solid var(--linea);width:38px;height:38px;border-radius:12px;display:grid;place-items:center;cursor:pointer;box-shadow:var(--sombra)}
.atras svg{width:20px;height:20px;fill:none;stroke:var(--tinta);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.lista{display:flex;flex-direction:column;gap:10px}
.fila{display:flex;align-items:center;gap:12px;background:var(--tarjeta);border:1px solid var(--linea);border-radius:var(--radio);padding:12px 14px;box-shadow:var(--sombra)}
.fila .t{flex:1;min-width:0}.fila .t b{display:block;font-weight:800;font-size:15px}.fila .t small{color:var(--suave);font-weight:600;font-size:12.5px}
.fila.hecho .t b{text-decoration:line-through;opacity:.55}
.emo{font-size:26px;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--azul) 10%,transparent);flex:none}
.btn{border:0;border-radius:14px;padding:11px 16px;font-weight:800;font-size:14px;cursor:pointer;background:linear-gradient(145deg,var(--azul2),var(--azul));color:#fff;box-shadow:0 6px 16px rgba(47,111,214,.3)}
html[data-estilo=formal] .btn{border-radius:10px;background:var(--azul);box-shadow:none}
.btn.sec{background:color-mix(in srgb,var(--azul) 12%,transparent);color:var(--azul);box-shadow:none}
.btn.peligro{background:color-mix(in srgb,var(--rojo) 12%,transparent);color:var(--rojo);box-shadow:none}
.btn.chico{padding:8px 12px;font-size:13px;border-radius:11px}
.btn.ancho{width:100%;margin-top:10px}
.acciones{display:flex;gap:8px;flex-wrap:wrap}
.vacio{text-align:center;color:var(--suave);font-weight:700;padding:30px 10px}
.interr{width:50px;height:30px;border-radius:15px;background:var(--linea);border:0;position:relative;cursor:pointer;flex:none;transition:.2s}
.interr::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.3);transition:.2s}
.interr.on{background:var(--ok)}.interr.on::after{left:23px}
input[type=text],input[type=tel],input[type=time],input[type=datetime-local],input[type=date],textarea,select{width:100%;border:1px solid var(--linea);background:var(--tarjeta);border-radius:12px;padding:12px;font-weight:700;font-size:15px;outline:none}
textarea{resize:vertical;font-family:inherit}
input:focus,select:focus,textarea:focus{border-color:var(--azul)}
label{display:block;font-weight:800;font-size:12.5px;color:var(--suave);margin:12px 2px 5px;text-transform:uppercase;letter-spacing:.8px}
.seg{display:flex;gap:6px;background:var(--linea);padding:4px;border-radius:14px}
.seg button{flex:1;border:0;background:transparent;padding:10px 6px;border-radius:11px;font-weight:800;font-size:13.5px;cursor:pointer;color:var(--suave)}
.seg button.on{background:var(--tarjeta);color:var(--tinta);box-shadow:0 2px 8px rgba(0,0,0,.15)}
.nota{font-size:12.5px;color:var(--suave);font-weight:600;margin:8px 4px}
.hoja{position:fixed;inset:0;background:rgba(5,12,30,.55);display:flex;align-items:flex-end;z-index:10}
.hoja>div{width:100%;max-width:560px;margin:0 auto;background:var(--fondo);border-radius:26px 26px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 20px);max-height:90vh;overflow:auto}
.hoja h3{margin:0 0 4px;font:800 19px var(--titulo)}
.aviso{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%);background:var(--tinta);color:var(--fondo);padding:11px 18px;border-radius:14px;font-weight:800;font-size:14px;z-index:20;max-width:90%;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.fab{position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom) + 20px);width:58px;height:58px;border-radius:20px;border:0;color:#fff;background:linear-gradient(145deg,var(--azul2),var(--azul));box-shadow:0 10px 24px rgba(47,111,214,.45);display:grid;place-items:center;cursor:pointer}
html[data-estilo=formal] .fab{border-radius:14px;background:var(--azul)}
.fab svg{width:28px;height:28px;stroke:#fff;fill:none;stroke-width:2.6;stroke-linecap:round}
.doc{background:var(--tarjeta);border:1px solid var(--linea);border-radius:var(--radio);padding:16px;box-shadow:var(--sombra);margin-bottom:12px;white-space:pre-wrap;word-break:break-word;font-size:14.5px;line-height:1.5;font-weight:600}
.doc b,.doc strong{font-weight:800}.doc a{color:var(--azul);font-weight:800}.doc code,.doc pre{font-family:ui-monospace,monospace;font-size:13px;background:var(--linea);border-radius:6px;padding:1px 5px}
.doc blockquote{margin:6px 0;padding-left:10px;border-left:3px solid var(--azul)}.doc .err{color:var(--rojo);font-weight:800}
.doc .botones{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;white-space:normal}
.esq{height:14px;width:60%;border-radius:7px;background:var(--linea);margin:10px 0;animation:pulso 1.1s infinite alternate}@keyframes pulso{to{opacity:.4}}
.caja{width:28px;height:28px;border-radius:9px;border:2px solid var(--suave);background:transparent;display:grid;place-items:center;font-weight:800;color:#fff;cursor:pointer;flex:none;padding:0}
.caja.on{background:var(--ok);border-color:var(--ok)}
.anadir{display:flex;gap:8px}.anadir .btn{padding:0 18px;font-size:20px}
.pasos{margin-top:14px;background:var(--tarjeta);border:1px solid var(--linea);border-radius:var(--radio);padding:14px;box-shadow:var(--sombra);position:relative}
.pasos b{display:block;font:800 15px var(--titulo);margin-bottom:4px;padding-right:26px}.pasos p{margin:0 0 10px;color:var(--suave);font-weight:600;font-size:13px}
.pasos .x{position:absolute;right:8px;top:8px;border:0;background:none;color:var(--suave);font-size:18px;cursor:pointer;padding:4px 8px}
.pasos .btn{width:100%}
.so{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:var(--linea);padding:4px;border-radius:14px;margin:6px 0 14px}
.so button{border:0;background:transparent;padding:8px 2px;border-radius:11px;font-weight:800;font-size:11.5px;cursor:pointer;color:var(--suave);display:flex;flex-direction:column;align-items:center;gap:2px}
.so button span{font-size:20px}.so button.on{background:var(--tarjeta);color:var(--tinta);box-shadow:0 2px 8px rgba(0,0,0,.15)}
.guia h4{margin:16px 2px 8px;font:800 15px var(--titulo)}
.paso{display:flex;gap:12px;align-items:flex-start;background:var(--tarjeta);border:1px solid var(--linea);border-radius:16px;padding:12px;margin-bottom:8px}
.paso i{flex:none;width:26px;height:26px;border-radius:50%;background:linear-gradient(145deg,var(--azul2),var(--azul));color:#fff;font:800 13px var(--fuente);display:grid;place-items:center;font-style:normal}
.paso div{font-size:13.5px;line-height:1.45;font-weight:500;color:var(--suave)}.paso div b{font-weight:800;color:var(--tinta)}
.paso small{display:block;color:var(--suave);font-size:12px;margin-top:2px;font-weight:600}
.guia details{background:var(--tarjeta);border:1px solid var(--linea);border-radius:16px;padding:4px 12px;margin-bottom:8px}
.guia summary{cursor:pointer;font-weight:800;font-size:13.5px;padding:9px 0;list-style:none}.guia summary::-webkit-details-marker{display:none}.guia summary::before{content:"▸ ";color:var(--azul)}
.guia details[open] summary::before{content:"▾ "}
.guia details p{margin:0 0 10px;font-size:13px;line-height:1.5;color:var(--suave);font-weight:600}
.aviso-ok{background:color-mix(in srgb,var(--ok) 14%,transparent);border-radius:14px;padding:11px 14px;font-weight:800;font-size:13.5px}
.c7{background:linear-gradient(145deg,#3ddc84,#128c4a)}
html[data-estilo=formal] .c7{--acento:#128c4a}
.etq{margin:18px 4px 8px;font:800 12.5px var(--fuente);color:var(--suave);text-transform:uppercase;letter-spacing:.8px}
.pulsable{width:100%;text-align:left;cursor:pointer;font:inherit;color:inherit}
.pulsable .ch{width:18px;height:18px;flex:none;fill:none;stroke:var(--suave);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.rcard{display:flex;gap:12px;align-items:flex-start;background:var(--tarjeta);border:1px solid var(--linea);border-radius:var(--radio);padding:12px 14px;box-shadow:var(--sombra);margin-bottom:10px;width:100%;text-align:left;cursor:pointer;font:inherit;color:inherit}
.rcard .t{flex:1;min-width:0}.rcard b{font:800 15px var(--titulo)}.rcard small{color:var(--suave);font-weight:700;font-size:12px;margin-left:6px}
.rcard p{margin:3px 0 0;font-size:13px;line-height:1.35;color:var(--suave);font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.noticias h4{margin:16px 2px 8px;font:800 15px var(--titulo)}
.noti{display:flex;gap:12px;align-items:center;background:var(--tarjeta);border:1px solid var(--linea);border-radius:16px;overflow:hidden;color:inherit;text-decoration:none;margin-bottom:10px;box-shadow:var(--sombra);cursor:pointer}
.noti .tx{padding:10px 12px;flex:1;min-width:0}.noti b{display:block;font:800 14.5px/1.3 var(--titulo)}.noti small{display:block;margin-top:5px;color:var(--suave);font-weight:700;font-size:12px}
.noti img{width:104px;height:80px;object-fit:cover;flex:none;margin:8px 8px 8px 0;border-radius:12px;background:var(--linea)}
.noti.grande{flex-direction:column;align-items:stretch;gap:0}.noti.grande img{width:100%;height:178px;margin:0;border-radius:0}.noti.grande b{font-size:16.5px}
.pie-ver{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 4px 12px}.pie-ver small{color:var(--suave);font-weight:700;font-size:12px}
.cargando{text-align:center;padding:60px 0;color:var(--suave);font-weight:800}
</style>
</head>

<symbol id="i-logo" viewBox="0 0 64 64"><rect x="9" y="12" width="46" height="42" rx="10" fill="var(--logo-fondo,#f4f8ff)" stroke="var(--logo-borde,#dfe9f8)" stroke-width="3"/><path d="M9 26h46" stroke="var(--logo-borde,#dfe9f8)" stroke-width="3"/><path d="M9 22a10 10 0 0 1 10-10h26a10 10 0 0 1 10 10v4H9z" fill="var(--logo-tapa,#ef4a5a)"/><rect x="20" y="6" width="5" height="12" rx="2.500" fill="var(--logo-borde,#dfe9f8)"/><rect x="39" y="6" width="5" height="12" rx="2.500" fill="var(--logo-borde,#dfe9f8)"/><path d="M22 39l7 7 14-15" fill="none" stroke="var(--logo-check,#3d6fcf)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</defs></svg>
<div class="app" id="app"><div class="cargando">Cargando…</div></div>
<script src="frases.js"></script>
<script>
const TG = window.Telegram && Telegram.WebApp;
const DEMO = new URLSearchParams(location.search).has("demo");
const S = { datos: null, vista: "inicio", pila: [], tipo: "alarma" };
const $ = (s, r = document) => r.querySelector(s);
const esc = (t) => String(t ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ic = (n) => `<svg><use href="#i-${n}"/></svg>`;

/* ---------- Tema: estilo del usuario y modo (claro/oscuro/automático = el del propio Telegram, o sea, el de tu dispositivo) ---------- */
function aplicarTema() {
  const u = S.datos?.usuario, root = document.documentElement;
  const sistema = (TG && TG.colorScheme) || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  const modo = !u || u.modo === "auto" ? (sistema === "dark" ? "oscuro" : "claro") : u.modo;
  root.dataset.estilo = u ? u.estilo : "informal"; root.dataset.modo = modo;
  const logo = modo === "oscuro" ? "--logo-fondo:#f4f8ff;--logo-borde:#dfe9f8;--logo-tapa:#ef4a5a;--logo-check:#3d6fcf" : "--logo-fondo:#fff;--logo-borde:#2f6fd6;--logo-tapa:#ef4a5a;--logo-check:#27a85a";
  const formal = root.dataset.estilo === "formal" ? "--logo-fondo:transparent;--logo-borde:currentColor;--logo-tapa:transparent;--logo-check:currentColor" : logo;
  root.style.cssText = formal;
  if (TG) { const bg = getComputedStyle(root).getPropertyValue("--fondo").trim() || "#eef5fd"; try { TG.setHeaderColor(bg); TG.setBackgroundColor(bg); } catch (e) {} }
}
if (TG) TG.onEvent("themeChanged", aplicarTema);
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", aplicarTema);

/* ---------- API ---------- */
/* Identificación: dentro de Telegram, con sus datos firmados; fuera (navegador o app instalada), con la sesión que crea el enlace de acceso (/app en el bot). */
const enTelegram = () => !!(TG && TG.initData);
const leerSesion = () => { try { return localStorage.getItem("sesion") || ""; } catch (e) { return ""; } };
const guardarSesion = (t) => { try { t ? localStorage.setItem("sesion", t) : localStorage.removeItem("sesion"); } catch (e) {} };
async function api(ruta, cuerpo = {}) {
  if (DEMO) return demo(ruta, cuerpo);
  const cab = { "content-type": "application/json" };
  if (enTelegram()) cab.authorization = "tma " + TG.initData; else if (leerSesion()) cab.authorization = "sesion " + leerSesion();
  const r = await fetch(ruta, { method: "POST", headers: cab, body: JSON.stringify(cuerpo) });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401 && !enTelegram() && ruta !== "/api/sesion") { guardarSesion(""); const e = new Error(j.error || "Tu sesión ha caducado"); e.sesion = true; throw e; }
  if (!r.ok) throw new Error(j.error || "Algo ha fallado");
  return j;
}
async function cargar() { S.datos = await api("/api/estado"); aplicarTema(); if (S.vista === "dispositivos" && typeof refrescarDispositivos === "function") await refrescarDispositivos(); }
function aviso(t) { const d = document.createElement("div"); d.className = "aviso"; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 2600); }
async function hacer(f, ok) { try { await f(); if (ok) aviso(typeof ok === "function" ? ok() : ok); await cargar(); pintar(); } catch (e) { aviso(e.message); } }

/* ---------- Contenido de Telegram → HTML seguro (solo etiquetas simples y enlaces https) ---------- */
function limpiar(html) {
  const d = new DOMParser().parseFromString("<body>" + html + "</body>", "text/html");
  const ok = new Set(["B", "STRONG", "I", "EM", "U", "S", "CODE", "PRE", "BLOCKQUOTE", "A"]);
  const rec = (n) => {
    if (n.nodeType === 3) return esc(n.textContent);
    if (n.nodeType !== 1) return "";
    const dentro = [...n.childNodes].map(rec).join("");
    if (!ok.has(n.tagName)) return dentro;
    const t = n.tagName.toLowerCase();
    if (t === "a") { const h = n.getAttribute("href") || ""; return /^https?:\/\//i.test(h) ? `<a href="${esc(h)}" data-url="${esc(h)}">${dentro}</a>` : dentro; }
    return `<${t}>${dentro}</${t}>`;
  };
  return [...d.body.childNodes].map(rec).join("");
}
async function abrirVer(ref, titulo, guardado = false) {
  const t = titulo || (ref === "todo" ? "Resumen de hoy" : (S.datos.secciones.find((s) => s.ref === ref) || {}).titulo || "Sección");
  const reemplaza = S.vista === "ver";
  S.ver = { ref, titulo: t, secciones: null };
  if (reemplaza) pintar(); else ir("ver");
  try { const r = await api("/api/ver", { ref, guardado }); S.ver.secciones = r.secciones; }
  catch (e) { S.ver.secciones = [{ ref, error: e.message, botones: [] }]; }
  if (S.vista === "ver" && S.ver.ref === ref) pintar();
}

/* ---------- Navegación, con el historial del navegador: el gesto de «atrás» del móvil vuelve a la pantalla anterior (o cierra la ventana abierta) en vez de salir de la app ---------- */
const IR = { perfil: "ajustes", eventos: "inicio" }; // nombres antiguos que aún pueden llegar de los botones de las secciones o de enlaces
const TIPOS_EV = ["alarma", "cita", "tarea", "nota", "mensaje"];
async function ir(v, tipo) {
  v = IR[v] || v;
  S.pila.push({ v: S.vista, tipo: S.tipo }); S.vista = v; if (tipo) S.tipo = tipo;
  if (v === "dispositivos") await refrescarDispositivos();
  history.pushState({ n: S.pila.length }, "");
  pintar(); window.scrollTo(0, 0);
}
function irDirecto(v, tipo) { S.pila = [{ v: "inicio" }]; S.vista = v; if (tipo) S.tipo = tipo; history.pushState({ n: 1 }, ""); pintar(); }
function volver() {
  const p = S.pila.pop(); S.vista = p ? p.v : "inicio"; if (p && p.tipo) S.tipo = p.tipo;
  pintar(); window.scrollTo(0, 0);
  if (S.vista === "inicio") cargar().then(pintar).catch(() => {}); // al volver a la principal se ve lo último (resúmenes pedidos, contadores…)
}
function atras() { if (S.pila.length && history.state && history.state.n) history.back(); else volver(); }
window.addEventListener("popstate", () => {
  if (S.ignorarPop) { S.ignorarPop = false; return; }
  const hoja = document.querySelector(".hoja");
  if (hoja) { S.cierraPop = true; hoja.remove(); return; } // «atrás» con una ventana abierta: se cierra la ventana
  if (S.pila.length) volver();
});
// Cada ventana (hoja) abierta añade una entrada al historial, para que «atrás» la cierre; si se cierra con sus botones, se deshace esa entrada.
new MutationObserver((cambios) => {
  for (const c of cambios) {
    for (const n of c.addedNodes) if (n.classList && n.classList.contains("hoja")) history.pushState({ hoja: 1 }, "");
    for (const n of c.removedNodes) if (n.classList && n.classList.contains("hoja")) {
      if (S.cierraPop) S.cierraPop = false;
      else if (history.state && history.state.hoja) { S.ignorarPop = true; history.back(); }
    }
  }
}).observe(document.body, { childList: true });
function botonAtras() {
  if (!TG || !TG.BackButton) return;
  if (S.vista === "inicio") TG.BackButton.hide(); else TG.BackButton.show();
}
if (TG && TG.BackButton) TG.BackButton.onClick(atras);

// La frase del día: una por cada día del año (frases.js), la misma para todo el mundo ese día.
{
  const h = new Date(), dia = Math.floor((Date.UTC(h.getFullYear(), h.getMonth(), h.getDate()) - Date.UTC(h.getFullYear(), 0, 0)) / 864e5); // 1..366
  S.frase = FRASES[(dia - 1) % FRASES.length];
}

/* ---------- Avatar: foto, avatar de emoji o burbuja con la inicial ---------- */
const fotoTelegram = () => (TG && TG.initDataUnsafe && TG.initDataUnsafe.user && TG.initDataUnsafe.user.photo_url) || "";
function burbuja(tam) {
  const u = S.datos.usuario, a = S.datos.avatar, nombre = (u.nombre || "").trim();
  const inicial = (nombre.charAt(0) || "?").toUpperCase();
  const g = a && a.tipo === "emoji" ? a.color : [...nombre].reduce((h, c) => (h * 31 + c.charCodeAt(0)) % 997, 7) % 8;
  const foto = a && a.tipo === "foto" ? S.datos.fotoAvatar : a && a.tipo === "telegram" ? fotoTelegram() : "";
  const dentro = a && a.tipo === "emoji" ? a.emoji : inicial;
  return `<span class="av g${g}" style="width:${tam}px;height:${tam}px;font-size:${Math.round(tam * 0.46)}px">${dentro}${foto ? `<img src="${esc(foto)}" alt="" onerror="this.remove()">` : ""}</span>`;
}
const botonAvatar = (tam = 58) => `<button class="avw" data-avatar="1" aria-label="Cambiar avatar" style="border:0;background:none;padding:0">${burbuja(tam)}<span class="lapiz">✎</span></button>`;
/* Invitación a instalar la app y a activar los avisos: solo la PRIMERA vez que se abre en este dispositivo (cada invitación una vez; la de avisos, una vez en el navegador y otra en la app instalada). */
const modoApp = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone;
const esIOS = () => /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const vistoBanner = (k) => { try { return !!localStorage.getItem("visto_" + k); } catch (e) { return false; } };
const marcarBanner = (k) => { try { localStorage.setItem("visto_" + k, "1"); } catch (e) {} };
function bannerApp() {
  if (enTelegram() || DEMO) return "";
  const soportaPush = "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
  const aqui = S.aqui && S.aqui.suscrito, cierre = `<button class="x" data-cerrar-banner="1" aria-label="Ahora no">✕</button>`;
  let clave = "", html = "";
  if (!modoApp() && S.instalacion) { clave = "instalar"; html = `<div class="pasos">${cierre}<b>📲 Instala la app</b><p>Se abre como cualquier app, a pantalla completa, y recibe tus avisos.</p><button class="btn" data-instalar="1">⬇️ Instalar ahora</button></div>`; }
  else if (!modoApp() && esIOS()) { clave = "ios"; html = `<div class="pasos">${cierre}<b>📲 Instala la app en tu iPhone</b><p>Safari → Compartir → «Añadir a pantalla de inicio». Después ábrela desde su icono para activar los avisos.</p><button class="btn" data-ir="dispositivos">Ver cómo</button></div>`; }
  else if (soportaPush && !aqui && (modoApp() || !esIOS()) && Notification.permission !== "denied") { clave = "avisos_" + (modoApp() ? "app" : "web"); html = `<div class="pasos">${cierre}<b>🔔 Activa los avisos</b><p>Recibe tus resúmenes y recordatorios como notificaciones de esta app.</p><button class="btn" data-activar-ya="1">🔔 Activar notificaciones</button></div>`; }
  if (!clave) return "";
  if (S.bannerClave !== clave && vistoBanner(clave)) return ""; // ya se enseñó en una apertura anterior
  S.bannerClave = clave; marcarBanner(clave); // se queda en pantalla durante esta sesión; la próxima vez no sale
  return S.bannerOculto === clave ? "" : html;
}
const cabecera = () => `<div class="cab"><div class="fila1">${botonAvatar()}<div><h1>${S.datos.usuario.nombre ? `¡Hola, ${esc(S.datos.usuario.nombre)}! 👋` : "¡Hola! 👋"}</h1><p>Organiza · Disfruta · Avanza</p></div></div><div class="dia">La frase del día:</div><div class="frase">${esc(S.frase)}</div></div>`;
const barra = (t, extra = "") => `<div class="barra"><button class="atras" data-a="volver" aria-label="Atrás">${ic("atras")}</button><h2>${t}</h2>${extra}</div>`;

/* ---------- Vistas ---------- */
const EMO = { alarma: "⏰", cita: "📅", tarea: "✅", mensaje: "💬" };
const TIPOS = {
  alarma: { emoji: "⏰", titulo: "Alarmas", icono: "alarma", color: "c2", vacio: "No tienes alarmas.", nuevo: "Nueva alarma" },
  cita: { emoji: "📅", titulo: "Citas", icono: "cal", color: "c1", vacio: "No tienes citas.", nuevo: "Nueva cita" },
  tarea: { emoji: "✅", titulo: "Tareas pendientes", icono: "check", color: "c3", vacio: "No tienes tareas pendientes.", nuevo: "Nueva tarea" },
  nota: { emoji: "📝", titulo: "Notas", icono: "nota", color: "c6", vacio: "No tienes notas.", nuevo: "Nueva nota" },
  mensaje: { emoji: "💬", titulo: "Mensajes de WhatsApp", icono: "chat", color: "c7", vacio: "No tienes mensajes programados.", nuevo: "Nuevo mensaje" },
};
const haceCuanto = (ms) => { if (!ms) return ""; const m = Math.max(1, Math.round((Date.now() - ms) / 60000)); return m < 60 ? `hace ${m} min` : m < 1440 ? `hace ${Math.round(m / 60)} h` : `hace ${Math.round(m / 1440)} d`; };
function noticiasHTML(grupos) {
  return `<div class="noticias">${grupos.map((g) => `${g.titulo ? `<h4>${esc(g.titulo)}</h4>` : ""}${g.noticias.map((n, i) => `<a class="noti ${i === 0 && n.imagen ? "grande" : ""}" href="${esc(n.enlace)}" data-url="${esc(n.enlace)}">${n.imagen ? `<img src="${esc(n.imagen)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : ""}<div class="tx"><b>${esc(n.titulo)}</b><small>${esc([n.fuente, haceCuanto(n.fecha)].filter(Boolean).join(" · "))}</small></div></a>`).join("")}`).join("")}</div>`;
}
const vistas = {
  inicio() {
    const ev = S.datos.eventos, cuenta = (t) => ev.filter((e) => e.tipo === t && !e.hecho).length, cp = S.datos.compra.items.filter((x) => !x.hecho).length;
    const t = (c, i, titulo, d, v, cls = "", extra = "") => `<button class="tarjeta ${cls}" data-ir="${v}" ${extra}><div class="ico ${c}">${ic(i)}</div><div><b>${titulo}</b><span class="d">${d}</span></div></button>`;
    const tt = (k, d) => t(TIPOS[k].color, TIPOS[k].icono, TIPOS[k].titulo, d, "tipo", "", `data-tipo="${k}"`);
    const n = (k, uno, varios, vacio) => { const c = cuenta(k); return c ? `${c} ${c === 1 ? uno : varios}` : vacio; };
    const hoy = S.datos.resumenHoy || [];
    const resumen = hoy.length
      ? hoy.map((r) => `<button class="rcard" data-ver="${esc(r.ref)}" data-g="1"><div class="emo">${r.emoji}</div><div class="t"><b>${esc(r.titulo)}</b><small>${esc(r.hora)}</small><p>${esc(r.previa)}</p></div></button>`).join("")
      : `<div class="doc" style="white-space:normal">Aún no has pedido ningún resumen hoy.<div class="botones"><button class="btn chico" data-ir="resumen">📋 Pedir un resumen</button></div></div>`;
    return `${cabecera()}${bannerApp()}
      <div class="etq">Tu resumen de hoy</div>${resumen}
      <div class="rejilla" style="margin-top:14px">
        ${tt("alarma", n("alarma", "pendiente", "pendientes", "Avisos a su hora"))}
        ${tt("cita", n("cita", "próxima", "próximas", "Tus citas"))}
        ${tt("tarea", n("tarea", "por hacer", "por hacer", "Todo al día"))}
        ${tt("nota", ev.filter((e) => e.tipo === "nota").length ? `${ev.filter((e) => e.tipo === "nota").length} guardadas` : "Apuntes rápidos")}
        ${tt("mensaje", n("mensaje", "programado", "programados", "Envíos en un toque"))}
        ${t("c5", "cesta", "Lista de la compra", cp ? `${cp} por comprar` : "Todo al día", "compra")}
        ${t("c4", "ajustes", "Ajustes", "Perfil, secciones y más", "ajustes", "ancha")}
      </div>`;
  },
  resumen() {
    const act = S.datos.secciones.filter((s) => s.activa), hoy = new Map((S.datos.resumenHoy || []).map((r) => [r.ref, r]));
    return `${barra("Resumen de hoy")}
      <p class="nota">Toca una sección para verla. Lo que pidas hoy se queda en tu pantalla principal.</p>
      <div class="lista">${S.datos.secciones.map((s) => `<button class="fila pulsable" data-ver="${esc(s.ref)}" data-g="${hoy.has(s.ref) ? 1 : 0}"><div class="emo">${s.emoji}</div><div class="t"><b>${esc(s.titulo)}</b><small>${hoy.has(s.ref) ? `✓ pedido hoy a las ${esc(hoy.get(s.ref).hora)}` : esc(s.descripcion)}</small></div><svg class="ch"><use href="#i-mas-der"/></svg></button>`).join("")}</div>
      <button class="btn ancho" data-ver="todo" ${act.length ? "" : "disabled style=opacity:.5"}>📋 Todo lo activado (${act.length})</button>`;
  },
  tipo() {
    const k = S.tipo, info = TIPOS[k], todos = S.datos.eventos.filter((e) => e.tipo === k);
    const fila = (e) => `<div class="fila ${e.hecho ? "hecho" : ""}"><div class="emo">${info.emoji}</div><div class="t" ${k === "nota" ? `data-nota="${e.id}" style="cursor:pointer"` : ""}><b>${esc(e.titulo)}</b><small>${k === "nota" ? esc((e.nota || "").replace(/\s+/g, " ").slice(0, 70)) : esc(e.texto)}${e.lugar ? " · " + esc(e.lugar) : ""}${e.repeticion !== "ninguna" ? " · 🔁" : ""}${e.mensaje ? ` · «${esc(e.mensaje.texto.slice(0, 40))}${e.mensaje.texto.length > 40 ? "…" : ""}»` : ""}</small></div>
      <div class="acciones">${e.mensaje ? `<button class="btn chico" data-wa="${e.id}" style="background:#25a85a">💬</button>` : ""}${k === "nota" ? "" : `<button class="btn chico sec" data-hecho="${e.id}">${e.hecho ? "↩︎" : "✓"}</button>`}<button class="btn chico peligro" data-borrar="${e.id}">🗑</button></div></div>`;
    const pend = k === "tarea" ? todos.filter((e) => !e.hecho) : todos, hechas = k === "tarea" ? todos.filter((e) => e.hecho) : [];
    return `${barra(info.titulo)}
      <div class="lista">${pend.length ? pend.map(fila).join("") : `<div class="vacio">${info.vacio}<br>Pulsa + para crear una.</div>`}</div>
      ${hechas.length ? `<label>Hechas (${hechas.length})</label><div class="lista">${hechas.map(fila).join("")}</div>` : ""}
      <button class="fab" data-nuevo="${k}" aria-label="${info.nuevo}">${ic("mas")}</button>`;
  },
  ajustes() {
    const u = S.datos.usuario, fila = (v, ico, t, d) => `<button class="fila pulsable" data-ir="${v}"><div class="emo">${ico}</div><div class="t"><b>${t}</b><small>${d}</small></div><svg class="ch"><use href="#i-mas-der"/></svg></button>`;
    const act = S.datos.secciones.filter((s) => s.activa).length;
    return `${barra("Ajustes")}
      <div class="lista"><div class="fila">${botonAvatar(46)}<div class="t"><b>${esc(u.nombre || "Sin nombre")}</b><small>${u.admin ? "Administrador" : "Usuario"} · toca tu avatar para cambiarlo</small></div></div>
      <button class="fila pulsable" data-ciudad="1"><div class="emo">📍</div><div class="t"><b>${u.ciudad ? esc(u.ciudad) : "Sin ciudad"}</b><small>${u.ciudad ? "Toca para cambiarla" : "Toca para elegir tu ciudad"} · ${esc(u.zona)}</small></div><svg class="ch"><use href="#i-mas-der"/></svg></button></div>
      <label>Tu nombre</label><input type="text" id="nombre" maxlength="40" value="${esc(u.nombre)}" placeholder="¿Cómo te llamo?">
      <label>Fecha de nacimiento (para el horóscopo)</label><input type="date" id="nac" value="${esc(u.nacimiento || "")}">
      <button class="btn ancho" data-perfil="1">Guardar</button>
      <div class="etq">Preferencias</div>
      <div class="lista">${fila("resumen", "📋", "Resumen de hoy", "Pide el tiempo, las noticias y más")}${fila("secciones", "🧩", "Mis secciones", `${act} activa${act === 1 ? "" : "s"} · horas y temas`)}${fila("apariencia", "🎨", "Apariencia", "Estilo y tema")}${fila("dispositivos", "📲", "App y notificaciones", "Instalar, avisos y otros dispositivos")}</div>`;
  },
  compra() {
    const l = S.datos.compra, pend = l.items.filter((x) => !x.hecho), hechos = l.items.filter((x) => x.hecho);
    const fila = (x) => `<div class="fila ${x.hecho ? "hecho" : ""}"><button class="caja ${x.hecho ? "on" : ""}" data-marcar="${x.id}" aria-label="Marcar">${x.hecho ? "✓" : ""}</button><div class="t" data-marcar="${x.id}"><b>${esc(x.texto)}</b></div><button class="btn chico peligro" data-quitar="${x.id}" aria-label="Quitar">✕</button></div>`;
    return `${barra("Lista de la compra", `<button class="btn chico sec" data-ir="historial">🕘 Historial</button>`)}
      <div class="anadir"><input type="text" id="nuevo-art" maxlength="60" placeholder="Añadir (varios, con comas)" autocomplete="off"><button class="btn" data-anadir="1">＋</button></div>

/* ---------- Formulario de evento ---------- */
function hojaNuevo(tipoIni = "alarma") {
  const d = new Date(Date.now() + 3600e3); d.setMinutes(0, 0, 0);
  const loc = new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
  const h = document.createElement("div"); h.className = "hoja";
  h.innerHTML = `<div><h3>Nuevo</h3>
    <div class="seg" id="tipo" style="margin-top:10px;font-size:12px"><button data-t="alarma">⏰ Alarma</button><button data-t="cita">📅 Cita</button><button data-t="tarea">✅ Tarea</button><button data-t="nota">📝 Nota</button><button data-t="mensaje">💬 WhatsApp</button></div>
    <div id="f-nombre"><label>Nombre</label><input type="text" id="f-titulo" maxlength="80" placeholder="¿Cómo lo llamamos?"></div>
    <div id="f-fecha"><label>Cuándo</label><input type="datetime-local" id="f-cuando" value="${loc}"></div>
    <div id="f-extra"></div>
    <button class="btn ancho" id="f-ok">Guardar</button><button class="btn sec ancho" id="f-no">Cancelar</button></div>`;
  document.body.appendChild(h);
  let tipo = tipoIni;
  const soportaContactos = "contacts" in navigator && "ContactsManager" in window;
  const wa = { modo: soportaContactos ? "contactos" : "manual", para: "", tel: "", texto: "", rep: "ninguna", opcionesTel: [] };
  const bloqueWa = () => `<label>Para quién</label>
    <div class="seg" id="wa-modo"><button class="${wa.modo === "contactos" ? "on" : ""}" data-wm="contactos">📇 Contactos</button><button class="${wa.modo === "manual" ? "on" : ""}" data-wm="manual">✍️ A mano</button><button class="${wa.modo === "elegir" ? "on" : ""}" data-wm="elegir">📲 Al enviar</button></div>
    ${wa.modo === "contactos" ? (soportaContactos
        ? `<button class="btn sec ancho" data-wa-elegir="1" style="margin-top:8px">📇 ${wa.para ? "Cambiar de contacto" : "Elegir de mis contactos"}</button>
           ${wa.opcionesTel.length > 1 ? `<p class="nota">${esc(wa.para)} tiene varios números, elige uno:</p>${wa.opcionesTel.map((t, i) => `<button class="btn sec ancho" style="margin-top:6px" data-wa-tel="${i}">${esc(t)}</button>`).join("")}` : ""}
           ${wa.para && wa.tel ? `<div class="aviso-ok" style="margin-top:8px">✅ ${esc(wa.para)} · ${esc(wa.tel)}</div>` : ""}`
        : `<p class="nota">Tu navegador no permite elegir contactos desde la app (solo Chrome en Android). Escríbelo «a mano» o elige «Al enviar».</p>`)
      : wa.modo === "manual" ? `<input type="text" id="f-para" maxlength="40" placeholder="Nombre (por ejemplo: Mamá)" value="${esc(wa.para)}" style="margin-top:8px"><input type="tel" id="f-tel" maxlength="20" placeholder="Teléfono: +34 600 000 000" autocomplete="off" value="${esc(wa.tel)}" style="margin-top:8px">`
      : `<input type="text" id="f-para" maxlength="40" placeholder="Nombre, para reconocerlo (opcional)" value="${esc(wa.para)}" style="margin-top:8px"><p class="nota">Cuando llegue el aviso, WhatsApp te dejará elegir a quién enviarlo: no hace falta número.</p>`}
    <label>Mensaje</label><textarea id="f-texto" maxlength="1000" rows="4" placeholder="Lo que quieres enviar">${esc(wa.texto)}</textarea>
    <label>Repetir</label><select id="f-rep">${[["ninguna", "Solo una vez"], ["anual", "Cada año (cumpleaños…)"], ["semanal", "Cada semana"], ["diaria", "Cada día"]].map(([v, t]) => `<option value="${v}" ${wa.rep === v ? "selected" : ""}>${t}</option>`).join("")}</select>
    <p class="nota">A la hora indicada te avisaré con un botón: lo pulsas, se abre WhatsApp con el mensaje ya escrito y solo tienes que enviarlo.</p>`;
  const volcar = () => { wa.para = $("#f-para", h)?.value ?? wa.para; wa.tel = $("#f-tel", h)?.value ?? wa.tel; wa.texto = $("#f-texto", h)?.value ?? wa.texto; wa.rep = $("#f-rep", h)?.value ?? wa.rep; };
  const extra = () => {
    $("#f-extra", h).innerHTML = (tipo === "cita" ? `<label>Lugar</label><input type="text" id="f-lugar" maxlength="80" placeholder="Opcional"><label>Avisarme</label><select id="f-ant"><option value="30">30 min antes</option><option value="60" selected>1 hora antes</option><option value="180">3 horas antes</option><option value="1440">1 día antes</option><option value="0">A la hora</option></select>` : "")
      + (tipo === "alarma" ? `<label>Repetir</label><select id="f-rep"><option value="ninguna">Solo una vez</option><option value="diaria">Cada día</option><option value="laborables">Lunes a viernes</option><option value="semanal">Cada semana</option><option value="anual">Cada año</option></select>` : "")
      + (tipo === "mensaje" ? bloqueWa() : "")
      + (tipo === "tarea" ? `<p class="nota">Las tareas pueden no tener fecha: deja el campo vacío.</p>` : "")
      + (tipo === "nota" ? `<label>Nota</label><textarea id="f-ntexto" maxlength="4000" rows="6" placeholder="Escribe lo que quieres recordar"></textarea>` : "");
  };
  const aplicarTipo = () => {
    h.querySelectorAll("#tipo button").forEach((b) => b.classList.toggle("on", b.dataset.t === tipo));
    $("#f-nombre", h).style.display = tipo === "mensaje" ? "none" : ""; $("#f-fecha", h).style.display = tipo === "nota" ? "none" : "";
    $("#f-titulo", h).placeholder = tipo === "nota" ? "Título (opcional)" : "¿Cómo lo llamamos?";
    extra();
  };
  aplicarTipo();
  h.addEventListener("click", async (e) => {
    if (tipo === "mensaje") volcar(); // no perder lo escrito al cambiar de modo
    const t = e.target.closest("[data-t]"); if (t) { tipo = t.dataset.t; aplicarTipo(); }
    const wm = e.target.closest("[data-wm]");
    if (wm) { wa.modo = wm.dataset.wm; if (wa.modo === "elegir") wa.tel = ""; wa.opcionesTel = []; extra(); }
    if (e.target.closest("[data-wa-elegir]")) {
      try {
        const [c] = await navigator.contacts.select(["name", "tel"], { multiple: false });
        if (c) { wa.para = (c.name && c.name[0]) || ""; wa.opcionesTel = [...new Set((c.tel || []).map((t) => t.trim()))]; wa.tel = wa.opcionesTel.length === 1 ? wa.opcionesTel[0] : ""; if (!wa.opcionesTel.length) aviso("Ese contacto no tiene teléfono"); extra(); }
      } catch (err) { /* cancelado o sin permiso */ }
    }
    const wt = e.target.closest("[data-wa-tel]"); if (wt) { wa.tel = wa.opcionesTel[+wt.dataset.waTel]; wa.opcionesTel = []; extra(); }
    if (e.target.id === "f-no" || e.target === h) h.remove();
    if (e.target.id === "f-ok") {
      const cuerpo = tipo === "mensaje" ? { tipo, cuando: $("#f-cuando", h).value || null, para: wa.para, telefono: wa.modo === "elegir" ? "" : wa.tel, texto: wa.texto, repeticion: wa.rep } : { tipo, titulo: $("#f-titulo", h).value, cuando: tipo === "nota" ? null : $("#f-cuando", h).value || null, lugar: $("#f-lugar", h)?.value, para: $("#f-para", h)?.value, telefono: $("#f-tel", h)?.value, texto: tipo === "nota" ? $("#f-ntexto", h)?.value : $("#f-texto", h)?.value, antelacionMin: $("#f-ant", h)?.value, repeticion: $("#f-rep", h)?.value };
      await hacer(() => api("/api/evento", cuerpo), "✅ Guardado"); if (!document.querySelector(".aviso")?.textContent.startsWith("✅")) return; h.remove();
    }
  });
}

/* Compartir: se crea un enlace a una lista que cualquiera puede abrir y modificar (marcar, añadir, quitar). Telegram no ofrece el menú «Compartir» del sistema dentro de las mini apps, así que se ofrecen los destinos más usados. */
function mensajeCompra(enlace) {
  const pend = S.datos.compra.items.filter((x) => !x.hecho);
  return "🛒 Lista de la compra\n" + pend.map((x) => "• " + x.texto).join("\n") + "\n\nÁbrela y ve marcando lo que compras:\n" + enlace;
}
async function copiar(t) {
  try { await navigator.clipboard.writeText(t); return true; } catch (e) {}
  try { const a = document.createElement("textarea"); a.value = t; document.body.appendChild(a); a.select(); const ok = document.execCommand("copy"); a.remove(); return ok; } catch (e) { return false; }
}
function abrirEnlace(u) { if (TG && TG.openLink) TG.openLink(u); else window.open(u, "_blank"); }
async function hojaCompartir() {
  if (!S.datos.compra.items.length) return aviso("La lista está vacía");
  let enlace;
  try { const r = await api("/api/compra", { accion: "compartir" }); enlace = r.enlace; S.datos.compra = r.compra; } catch (e) { return aviso(e.message); }
  const texto = mensajeCompra(enlace);
  const h = document.createElement("div"); h.className = "hoja";
  h.innerHTML = `<div><h3>Compartir la lista</h3><p class="nota">Quien reciba el enlace podrá <b>ver, añadir y marcar</b> productos, y tú verás los cambios aquí. Al terminar la compra, el enlace deja de valer y la siguiente lista tendrá uno nuevo.</p><div class="doc" style="white-space:pre-wrap;font-size:13px">${esc(texto)}</div>
    <button class="btn ancho" data-c="wa">💬 WhatsApp</button>
    <button class="btn ancho" data-c="mail">✉️ Correo</button>
    <button class="btn ancho" data-c="tg">✈️ Telegram</button>
    ${navigator.share ? `<button class="btn ancho" data-c="otras">📤 Otras aplicaciones…</button>` : ""}
    <button class="btn sec ancho" data-c="copiar">📋 Copiar el mensaje</button>
    <button class="btn peligro ancho" data-c="parar">🚫 Dejar de compartir</button>
    <button class="btn sec ancho" data-c="no">Cerrar</button></div>`;
  document.body.appendChild(h);
  h.addEventListener("click", async (e) => {
    const c = e.target.closest("[data-c]")?.dataset.c;
    if (e.target === h || c === "no") return h.remove();
    if (!c) return;
    const t = encodeURIComponent(texto);
    if (c === "wa") abrirEnlace("https://wa.me/?text=" + t);
    else if (c === "mail") abrirEnlace("mailto:?subject=" + encodeURIComponent("Lista de la compra") + "&body=" + t);
    else if (c === "tg") { const u = "https://t.me/share/url?url=" + encodeURIComponent(enlace) + "&text=" + encodeURIComponent("🛒 Lista de la compra"); if (TG && TG.openTelegramLink) TG.openTelegramLink(u); else window.open(u, "_blank"); }
    else if (c === "otras") { try { await navigator.share({ title: "Lista de la compra", text: texto }); } catch (err) {} }
    else if (c === "copiar") { aviso((await copiar(texto)) ? "📋 Copiado" : "No he podido copiar"); return; }
    else if (c === "parar") { h.remove(); return hacer(() => api("/api/compra", { accion: "descompartir" }), "🚫 Enlace desactivado"); }
    h.remove();
  });
}

/* ---------- Cambiar avatar ---------- */
function redimensionar(archivo) {
  return new Promise((ok, mal) => {
    const url = URL.createObjectURL(archivo), img = new Image();
    img.onload = () => {
      const t = 192, c = document.createElement("canvas"); c.width = c.height = t;
      const lado = Math.min(img.width, img.height), sx = (img.width - lado) / 2, sy = (img.height - lado) / 2;

/* ---------- Actualización automática: lo que se cambie desde otro dispositivo aparece solo ---------- */
const huella = (d) => { const c = { ...d }; delete c.ahora; return JSON.stringify(c); };
async function refrescar() {
  if (document.hidden || !S.datos || DEMO || S.ocupado) return;
  if (S.vista === "ver" || document.querySelector(".hoja")) return; // contenido ya preparado o ventana abierta: no se toca
  if ([...document.querySelectorAll("input,textarea,select")].some((e) => e.type !== "file" && e.value !== e.defaultValue)) return; // no pisar lo que se está escribiendo
  S.ocupado = true;
  try {
    const d = await api("/api/estado");
    if (!document.hidden && huella(d) !== huella(S.datos)) { S.datos = d; aplicarTema(); if (S.vista === "dispositivos") await refrescarDispositivos(); pintar(); }
  } catch (e) { /* sin conexión o sesión caducada: se reintenta en el siguiente ciclo */ }
  S.ocupado = false;
}
setInterval(refrescar, 15000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) refrescar(); });
window.addEventListener("focus", refrescar);
