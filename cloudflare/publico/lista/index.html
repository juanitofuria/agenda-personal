<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Lista de la compra</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--fondo:#eef5fd;--fondo2:#dcebfa;--tarjeta:#fff;--tinta:#0f2347;--suave:#51658a;--linea:rgba(30,70,140,.12);--azul:#2f6fd6;--azul2:#46a0ff;--ok:#27a85a;--rojo:#ef4a5a;--sombra:0 10px 28px rgba(40,90,170,.14)}
@media (prefers-color-scheme:dark){:root{--fondo:#0d1b34;--fondo2:#0a1630;--tarjeta:#14274a;--tinta:#fff;--suave:#9fb7e0;--linea:rgba(150,185,255,.16);--azul:#3d9bff;--sombra:0 10px 28px rgba(0,0,0,.35)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:'Nunito',system-ui,sans-serif;color:var(--tinta);background:linear-gradient(160deg,var(--fondo),var(--fondo2));min-height:100vh;padding-bottom:40px}
.app{max-width:520px;margin:0 auto;padding:16px}
h1{margin:6px 4px 2px;font-weight:800;font-size:24px}
.sub{margin:0 4px 16px;color:var(--suave);font-weight:700;font-size:13.5px}
.fila{display:flex;align-items:center;gap:12px;background:var(--tarjeta);border:1px solid var(--linea);border-radius:18px;padding:12px 14px;box-shadow:var(--sombra);margin-bottom:10px}
.fila b{flex:1;font-weight:800;font-size:15.5px;cursor:pointer}
.fila.hecho b{text-decoration:line-through;opacity:.5}
.caja{width:30px;height:30px;border-radius:10px;border:2px solid var(--suave);background:transparent;display:grid;place-items:center;font-weight:800;color:#fff;cursor:pointer;flex:none;padding:0;font-size:16px}
.caja.on{background:var(--ok);border-color:var(--ok)}
.x{border:0;background:color-mix(in srgb,var(--rojo) 12%,transparent);color:var(--rojo);border-radius:10px;padding:7px 11px;font-weight:800;cursor:pointer}
.anadir{display:flex;gap:8px;margin-bottom:14px}
input{flex:1;min-width:0;border:1px solid var(--linea);background:var(--tarjeta);color:var(--tinta);border-radius:14px;padding:13px;font:700 15px 'Nunito',sans-serif;outline:none}
input:focus{border-color:var(--azul)}
.mas{border:0;border-radius:14px;padding:0 20px;font-size:22px;font-weight:800;color:#fff;background:linear-gradient(145deg,var(--azul2),var(--azul));cursor:pointer}
.etq{margin:18px 4px 8px;font-weight:800;font-size:12.5px;color:var(--suave);text-transform:uppercase;letter-spacing:.8px}
.vacio,.msg{text-align:center;color:var(--suave);font-weight:700;padding:34px 10px}
.pie{margin-top:22px;text-align:center;color:var(--suave);font-size:12px;font-weight:600}
</style>
</head>
<body>
<div class="app" id="app"><div class="msg">Cargando…</div></div>
<script>
const token = new URLSearchParams(location.search).get("t") || "";
let datos = null, ocupado = false;
const esc = (t) => String(t ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
async function api(cuerpo) {
  const r = await fetch("/api/lista", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ token, ...cuerpo }) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || "Algo ha fallado");
  return j;
}
function pintar(foco) {
  const a = document.getElementById("app");
  if (!datos) return;
  const pend = datos.items.filter((x) => !x.hecho), hechos = datos.items.filter((x) => x.hecho);
  const fila = (x) => `<div class="fila ${x.hecho ? "hecho" : ""}"><button class="caja ${x.hecho ? "on" : ""}" data-m="${x.id}">${x.hecho ? "✓" : ""}</button><b data-m="${x.id}">${esc(x.texto)}</b><button class="x" data-q="${x.id}">✕</button></div>`;
  const previo = document.getElementById("nuevo")?.value || "";
  a.innerHTML = `<h1>🛒 Lista de la compra</h1><p class="sub">${datos.propietario ? "De " + esc(datos.propietario) + " · " : ""}Toca un producto para marcarlo como comprado</p>
    <div class="anadir"><input id="nuevo" maxlength="60" placeholder="Añadir (varios, con comas)" autocomplete="off"><button class="mas" id="mas">＋</button></div>
    ${pend.map(fila).join("") || (hechos.length ? "" : '<div class="vacio">La lista está vacía.</div>')}
    ${hechos.length ? `<div class="etq">Comprado (${hechos.length})</div>${hechos.map(fila).join("")}` : ""}
    <div class="pie">Cualquiera con este enlace puede modificar la lista. Los cambios se ven al momento.</div>`;
  const n = document.getElementById("nuevo"); n.value = previo; if (foco) n.focus();
}
async function accion(c, foco) {
  if (ocupado) return; ocupado = true;
  try { datos = await api(c); pintar(foco); } catch (e) { if (/ya no está disponible/.test(e.message)) fin(e.message); else alert(e.message); }
  ocupado = false;
}
function fin(m) { clearInterval(reloj); document.getElementById("app").innerHTML = `<div class="msg">${esc(m)}<br><br>Pídele a quien te la envió que te mande el enlace nuevo.</div>`; }
document.addEventListener("click", (e) => {
  const m = e.target.closest("[data-m]"), q = e.target.closest("[data-q]");
  if (m) accion({ accion: "marcar", id: m.dataset.m });
  else if (q) accion({ accion: "quitar", id: q.dataset.q });
  else if (e.target.closest("#mas")) { const t = document.getElementById("nuevo").value.trim(); if (t) { document.getElementById("nuevo").value = ""; accion({ accion: "anadir", texto: t }, true); } }
});
document.addEventListener("keydown", (e) => { if (e.key === "Enter" && e.target.id === "nuevo") document.getElementById("mas").click(); });
// Se refresca solo cada pocos segundos mientras la página está a la vista (sin pisar lo que se esté escribiendo).
async function refrescar() { if (ocupado || document.hidden || !datos) return; try { const d = await api({ accion: "estado" }); if (JSON.stringify(d.items) !== JSON.stringify(datos.items)) { datos = d; const f = document.activeElement?.id === "nuevo"; pintar(f); } } catch (e) { if (/ya no está disponible/.test(e.message)) fin(e.message); } }
const reloj = setInterval(refrescar, 8000);
document.addEventListener("visibilitychange", refrescar);
(async () => { try { datos = await api({ accion: "estado" }); pintar(); } catch (e) { fin(e.message); } })();
</script>
</body>
</html>
