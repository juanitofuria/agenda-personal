name = "agenda-personal"
main = "src/worker.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]   # necesario para `node:crypto` y `Buffer` (comparación segura del secreto)

[triggers]
# Hora UTC. El primero es el planificador (cada minuto); el segundo descarga el horóscopo (ver CRON_HOROSCOPO en worker.ts).
crons = ["* * * * *", "*/10 4-10 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "agenda-personal"
database_id = "PON-AQUI-EL-ID"   # lo imprime `npx wrangler d1 create agenda-personal`

[vars]
HOROSCOPO_BASE_URL = "https://horoscopefree.fly.dev"
HOROSCOPO_IDIOMA = "es"
