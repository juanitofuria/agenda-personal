name = "agenda-personal"
main = "dist/worker.js"   # Worker ya empaquetado (se genera con `npm run empaquetar`): así no hace falta instalar nada para desplegar
compatibility_date = "2025-09-01"

[assets]
directory = "./publico"

[triggers]
# Hora UTC. El primero procesa recordatorios y notificaciones; el segundo actualiza los horóscopos.
crons = ["* * * * *", "*/10 4-10 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "agenda-personal"
database_id = "8365b814-ff49-4946-b802-2809f951abbf"   # id de tu base de datos D1 (no es secreto: solo vale con tu sesión de Cloudflare)

[vars]
HOROSCOPO_BASE_URL = "https://horoscopefree.fly.dev"
HOROSCOPO_IDIOMA = "es"
APP_ORIGINS = "https://bexora-agenda-personal.web.app,https://nexora-agenda-personal.web.app"
FIREBASE_WEB_CONFIG = { apiKey = "AIzaSyAFtbdszR57mpw-9eZLPA8qbIK7yPsaeNo", authDomain = "bexora-agenda-personal.firebaseapp.com", appId = "1:91393495192:web:0baacd446235799cf640ed", messagingSenderId = "91393495192", projectId = "bexora-agenda-personal", storageBucket = "bexora-agenda-personal.firebasestorage.app" }
