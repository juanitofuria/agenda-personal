name = "agenda-personal"
main = "dist/worker.js"   # Worker ya empaquetado (se genera con `npm run empaquetar`): así no hace falta instalar nada para desplegar
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]   # necesario para `node:crypto` y `Buffer` (comparación segura del secreto)

# El código común de ../firebase/functions importa esta librería: se busca en las dependencias de esta carpeta.
[alias]
"fast-xml-parser" = "./node_modules/fast-xml-parser"

[triggers]
# Hora UTC. El primero es el planificador (cada minuto); el segundo descarga el horóscopo (ver CRON_HOROSCOPO en worker.ts).
crons = ["* * * * *", "*/10 4-10 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "agenda-personal"
database_id = "8365b814-ff49-4946-b802-2809f951abbf"   # id de tu base de datos D1 (no es secreto: solo vale con tu sesión de Cloudflare)

[vars]
HOROSCOPO_BASE_URL = "https://horoscopefree.fly.dev"
HOROSCOPO_IDIOMA = "es"
